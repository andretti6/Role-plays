<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Data We Live In · 5 Trends, 5 Conversations</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Inter', sans-serif;
        background: #f2f6fb;
        background-image:
            radial-gradient(circle at 8% 0%, rgba(29, 78, 216, 0.09), transparent 42%),
            radial-gradient(circle at 95% 100%, rgba(13, 148, 136, 0.09), transparent 42%);
        background-attachment: fixed;
        color: #13202d;
        min-height: 100vh;
        padding: 24px 16px 60px;
    }

    .wrap { max-width: 940px; margin: 0 auto; }

    /* ---------- HEADER ---------- */
    .top {
        display: flex; align-items: center; justify-content: space-between;
        gap: 16px; flex-wrap: wrap; margin-bottom: 20px;
    }
    .brand { display: flex; align-items: center; gap: 13px; }
    .logo {
        width: 48px; height: 48px; border-radius: 15px;
        background: linear-gradient(135deg, #1d4ed8, #0d9488);
        color: #fff; display: flex; align-items: center; justify-content: center;
        font-size: 20px; box-shadow: 0 10px 22px rgba(29, 78, 216, 0.28);
        flex-shrink: 0;
    }
    .brand h1 { font-size: 19px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.2; }
    .brand p { font-size: 12px; color: #6b8299; font-weight: 600; margin-top: 2px; }

    .pdot-row { display: flex; gap: 7px; align-items: center; }
    .pdot {
        width: 10px; height: 10px; border-radius: 50%;
        background: #d3e0ee; transition: all 0.25s;
    }
    .pdot.done { background: #16a34a; }
    .pdot.active { background: #1d4ed8; width: 26px; border-radius: 6px; }

    /* ---------- CARD ---------- */
    .card {
        background: #ffffff; border: 1px solid #e6eef6; border-radius: 26px;
        padding: 28px;
        box-shadow: 0 20px 44px rgba(20, 45, 80, 0.10);
        animation: cardIn 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.05);
    }
    @keyframes cardIn {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: none; }
    }

    .card-top {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
    }
    .kicker {
        font-size: 11px; font-weight: 800; letter-spacing: 0.9px;
        text-transform: uppercase; color: #1d4ed8;
        background: #eaf1ff; padding: 5px 13px; border-radius: 30px;
    }
    .counter {
        font-size: 12px; font-weight: 800; color: #8098ad;
        background: #f2f7fc; padding: 5px 13px; border-radius: 30px;
    }
    .title {
        font-size: 27px; font-weight: 800; letter-spacing: -0.6px;
        line-height: 1.2; margin-bottom: 8px;
    }
    .lede {
        font-size: 15px; line-height: 1.6; color: #4a6580;
        font-weight: 500; margin-bottom: 20px;
    }

    /* ---------- CHART ---------- */
    .chart-card {
        background: #f9fbfe; border: 1px solid #e6eef6;
        border-radius: 18px; padding: 18px 14px 12px;
        margin-bottom: 14px; overflow: hidden;
    }
    .chart-svg { width: 100%; height: auto; display: block; }
    .chart-foot {
        margin-top: 10px; font-size: 12px; color: #8098ad;
        font-weight: 600; display: flex; align-items: flex-start; gap: 7px;
        padding: 0 4px; line-height: 1.45;
    }
    .chart-foot i { color: #a8bacb; margin-top: 2px; flex-shrink: 0; }

    .axis-txt  { font-size: 13px;  font-weight: 700; fill: #98aec2; }
    .axis-title{ font-size: 12px;  font-weight: 800; fill: #6b8299; letter-spacing: 0.3px; }
    .cat-txt   { font-size: 14px;  font-weight: 800; fill: #4a6580; }
    .sub-txt   { font-size: 12px;  font-weight: 700; fill: #98aec2; }
    .val-txt   { font-size: 15px;  font-weight: 800; fill: #13202d; }
    .stack-val { font-size: 13px;  font-weight: 800; fill: #ffffff; }
    .legend-txt{ font-size: 13px;  font-weight: 700; fill: #4a6580; }

    .bar {
        transform-box: fill-box; transform-origin: bottom;
        animation: growY 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.1) both;
    }
    @keyframes growY { from { transform: scaleY(0); } to { transform: scaleY(1); } }

    .hbar {
        transform-box: fill-box; transform-origin: left;
        animation: growX 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.1) both;
    }
    @keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    .val-txt { animation: fadeUp 0.5s ease-out both; }
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: none; }
    }

    .node {
        transform-box: fill-box; transform-origin: center;
        animation: popDot 0.4s ease-out both;
    }
    @keyframes popDot { from { transform: scale(0); } to { transform: scale(1); } }

    .line-path {
        stroke-dasharray: 1; stroke-dashoffset: 1;
        animation: drawLine 1.1s ease-out 0.15s forwards;
    }
    @keyframes drawLine { to { stroke-dashoffset: 0; } }

    /* ---------- TALK ---------- */
    .talk {
        background: #f7fafd; border: 1px solid #eaf1f8;
        border-radius: 18px; padding: 20px 22px; margin-bottom: 20px;
    }
    .talk-title {
        font-size: 12px; font-weight: 800; letter-spacing: 0.8px;
        text-transform: uppercase; color: #0f766e;
        display: flex; align-items: center; gap: 9px; margin-bottom: 15px;
    }
    .qlist { display: flex; flex-direction: column; gap: 14px; list-style: none; counter-reset: q; }
    .qlist li {
        counter-increment: q; display: flex; gap: 13px;
        font-size: 15.5px; font-weight: 600; line-height: 1.55; color: #1c3350;
    }
    .qlist li::before {
        content: counter(q); flex-shrink: 0;
        width: 28px; height: 28px; border-radius: 9px;
        background: #ffffff; border: 1.5px solid #dbe7f1; color: #0f766e;
        font-size: 13px; font-weight: 800;
        display: flex; align-items: center; justify-content: center;
        margin-top: 1px;
    }

    /* ---------- CTA ---------- */
    .cta { display: flex; flex-direction: column; align-items: center; gap: 9px; }
    .got-it {
        border: none; border-radius: 40px;
        background: linear-gradient(135deg, #1d4ed8, #16389b);
        color: #fff; font-family: inherit; font-size: 16px; font-weight: 800;
        letter-spacing: -0.2px; padding: 15px 34px; cursor: pointer;
        display: inline-flex; align-items: center; gap: 12px;
        box-shadow: 0 14px 30px rgba(29, 78, 216, 0.32);
        transition: all 0.18s;
    }
    .got-it:hover { transform: translateY(-2px); box-shadow: 0 18px 38px rgba(29, 78, 216, 0.42); }
    .got-it:active { transform: translateY(0); }
    .got-it i {
        font-size: 13px; background: rgba(255, 255, 255, 0.22);
        width: 26px; height: 26px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
    }
    .cta-hint { font-size: 12.5px; color: #8098ad; font-weight: 600; text-align: center; }

    /* ---------- MODAL ---------- */
    .modal-bg {
        position: fixed; inset: 0; background: rgba(19, 32, 45, 0.5);
        backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
        display: flex; align-items: center; justify-content: center;
        padding: 20px; opacity: 0; pointer-events: none;
        transition: opacity 0.2s; z-index: 500;
    }
    .modal-bg.show { opacity: 1; pointer-events: auto; }
    .modal {
        background: #ffffff; border-radius: 24px;
        padding: 28px 26px 22px; max-width: 420px; width: 100%;
        text-align: center; box-shadow: 0 30px 70px rgba(10, 25, 45, 0.35);
        transform: translateY(14px) scale(0.97);
        transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    }
    .modal-bg.show .modal { transform: none; }
    .modal-emoji { font-size: 38px; line-height: 1; margin-bottom: 12px; }
    .modal h3 { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 7px; }
    .modal p { font-size: 14px; color: #5a7189; font-weight: 500; line-height: 1.5; margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; }
    .mbtn {
        flex: 1; border: none; border-radius: 40px; padding: 13px 18px;
        font-family: inherit; font-size: 14px; font-weight: 800;
        cursor: pointer; transition: all 0.16s;
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .mbtn.ghost { background: #eef3f9; color: #3d5a75; }
    .mbtn.ghost:hover { background: #dbe7f1; }
    .mbtn.primary {
        background: linear-gradient(135deg, #16a34a, #0d9488); color: #fff;
        box-shadow: 0 10px 22px rgba(13, 148, 136, 0.3);
    }
    .mbtn.primary:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(13, 148, 136, 0.38); }

    /* ---------- FINISH ---------- */
    .finish { text-align: center; padding: 46px 26px; }
    .finish-emoji { font-size: 54px; line-height: 1; margin-bottom: 14px; }
    .finish h2 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 10px; }
    .finish p {
        font-size: 15px; color: #5a7189; font-weight: 500;
        line-height: 1.6; margin: 0 auto 24px; max-width: 500px;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 640px) {
        body { padding: 14px 10px 50px; }
        .card { padding: 18px 15px; border-radius: 20px; }
        .title { font-size: 21px; }
        .lede { font-size: 14px; }
        .chart-card { padding: 12px 6px 8px; }
        .talk { padding: 15px 14px; }
        .qlist li { font-size: 14px; }
        .got-it { width: 100%; justify-content: center; padding: 15px 20px; }
        .brand h1 { font-size: 16.5px; }
        .axis-txt { font-size: 14px; }
        .cat-txt { font-size: 15px; }
        .val-txt { font-size: 16px; }
    }
</style>
</head>
<body>

<div class="wrap">

    <header class="top">
        <div class="brand">
            <div class="logo"><i class="fas fa-chart-line"></i></div>
            <div>
                <h1>The Data We Live In</h1>
                <p>5 trends · 5 conversations · real numbers</p>
            </div>
        </div>
        <div class="pdot-row" id="dots" aria-label="Progress"></div>
    </header>

    <main id="stage"></main>

</div>

<!-- CONFIRM MODAL -->
<div class="modal-bg" id="modalBg" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-emoji">💬</div>
        <h3 id="modalTitle">Move to the next trend?</h3>
        <p id="modalText">Make sure everyone has had a chance to react to at least one of the questions.</p>
        <div class="modal-actions">
            <button type="button" class="mbtn ghost" id="cancelMove">Not yet</button>
            <button type="button" class="mbtn primary" id="confirmMove">
                Yes, next <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>
</div>

<script>
(function () {
    'use strict';

    /* ================================================================
       HELPERS
       ================================================================ */
    function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }
    function fmt(v) {
        return Number.isInteger(v) ? String(v) : v.toFixed(1);
    }

    /* ================================================================
       CHART BUILDERS
       ================================================================ */

    /* --- vertical bars --- */
    function vBarChart(items, opts) {
        opts = opts || {};
        var W = 660, H = 390;
        var padL = 88, padR = 28, padT = 44, padB = 92;
        var plotW = W - padL - padR;
        var plotH = H - padT - padB;
        var yMax = opts.yMax || 100;
        var yUnit = opts.yUnit || '';
        var n = items.length;
        var slot = plotW / n;
        var bw = Math.min(74, slot * 0.56);
        var y0 = padT + plotH;
        var maxVal = Math.max.apply(null, items.map(function (i) { return i.value; }));

        var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart-svg" role="img" aria-label="' +
                  esc(opts.aria || 'Bar chart') + '">';

        /* y-axis title */
        if (opts.yTitle) {
            out += '<text x="18" y="' + (padT + plotH / 2) + '" text-anchor="middle" ' +
                   'class="axis-title" transform="rotate(-90 18 ' + (padT + plotH / 2) + ')">' +
                   esc(opts.yTitle) + '</text>';
        }

        [0, 0.25, 0.5, 0.75, 1].forEach(function (f) {
            var v = f * yMax;
            var y = padT + plotH * (1 - v / yMax);
            out += '<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y +
                   '" stroke="#e6eef6" stroke-width="1.5"/>';
            out += '<text x="' + (padL - 12) + '" y="' + (y + 5) +
                   '" text-anchor="end" class="axis-txt">' + fmt(v) + yUnit + '</text>';
        });

        out += '<line x1="' + padL + '" y1="' + y0 + '" x2="' + (W - padR) + '" y2="' + y0 +
               '" stroke="#c9d9e8" stroke-width="2"/>';

        items.forEach(function (it, i) {
            var cx = padL + slot * (i + 0.5);
            var h = plotH * (it.value / yMax);
            var x = cx - bw / 2;
            var y = y0 - h;
            var isMax = it.value === maxVal;
            var fill = isMax ? (opts.accent || '#1d4ed8') : (opts.base || '#9dbcda');
            var delay = (0.08 * i + 0.1).toFixed(2);

            out += '<rect class="bar" x="' + x + '" y="' + y + '" width="' + bw +
                   '" height="' + Math.max(h, 2) + '" rx="9" fill="' + fill +
                   '" style="animation-delay:' + delay + 's"/>';

            out += '<text x="' + cx + '" y="' + (y - 12) + '" text-anchor="middle" class="val-txt"' +
                   ' style="animation-delay:' + (0.08 * i + 0.36).toFixed(2) + 's">' +
                   fmt(it.value) + yUnit + '</text>';

            out += '<text x="' + cx + '" y="' + (y0 + 28) + '" text-anchor="middle" class="cat-txt">' +
                   esc(it.label) + '</text>';

            if (it.sub) {
                out += '<text x="' + cx + '" y="' + (y0 + 50) +
                       '" text-anchor="middle" class="sub-txt">' + esc(it.sub) + '</text>';
            }
        });

        out += '</svg>';
        return out;
    }

    /* --- horizontal bars --- */
    function hBarChart(items, opts) {
        opts = opts || {};
        var W = 660;
        var padL = 230, padR = 100, padT = 46, rowH = 68, padB = 34;
        var H = padT + padB + items.length * rowH;
        var plotW = W - padL - padR;
        var max = opts.max || Math.max.apply(null, items.map(function (i) { return i.value; }));
        var maxVal = Math.max.apply(null, items.map(function (i) { return i.value; }));

        var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart-svg" role="img" aria-label="' +
                  esc(opts.aria || 'Bar chart') + '">';

        if (opts.xTitle) {
            out += '<text x="' + (padL + plotW / 2) + '" y="24" text-anchor="middle" class="axis-title">' +
                   esc(opts.xTitle) + '</text>';
        }

        out += '<line x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (H - padB) +
               '" stroke="#c9d9e8" stroke-width="2"/>';

        items.forEach(function (it, i) {
            var y = padT + i * rowH + 10;
            var w = plotW * (it.value / max);
            var isMax = it.value === maxVal;
            var fill = isMax ? (opts.accent || '#0f766e') : (opts.base || '#a4cec4');

            out += '<text x="' + (padL - 16) + '" y="' + (y + 28) +
                   '" text-anchor="end" class="cat-txt">' + esc(it.label) + '</text>';

            out += '<rect class="hbar" x="' + padL + '" y="' + y + '" width="' + Math.max(w, 2) +
                   '" height="40" rx="10" fill="' + fill +
                   '" style="animation-delay:' + (0.09 * i + 0.1).toFixed(2) + 's"/>';

            out += '<text x="' + (padL + w + 14) + '" y="' + (y + 28) + '" class="val-txt"' +
                   ' style="animation-delay:' + (0.09 * i + 0.32).toFixed(2) + 's">' +
                   fmt(it.value) + (opts.unit || '') + '</text>';
        });

        out += '</svg>';
        return out;
    }

    /* --- line chart --- */
    function lineChart(points, opts) {
        opts = opts || {};
        var W = 660, H = 360;
        var padL = 88, padR = 50, padT = 44, padB = 76;
        var plotW = W - padL - padR;
        var plotH = H - padT - padB;
        var yMax = opts.yMax || 10;
        var xMin = opts.xMin, xMax = opts.xMax;
        var color = opts.color || '#1d4ed8';

        function X(yr) { return padL + plotW * (yr - xMin) / (xMax - xMin); }
        function Y(v) { return padT + plotH * (1 - v / yMax); }

        var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart-svg" role="img" aria-label="' +
                  esc(opts.aria || 'Line chart') + '">';

        if (opts.yTitle) {
            out += '<text x="18" y="' + (padT + plotH / 2) + '" text-anchor="middle" ' +
                   'class="axis-title" transform="rotate(-90 18 ' + (padT + plotH / 2) + ')">' +
                   esc(opts.yTitle) + '</text>';
        }

        [0, 0.25, 0.5, 0.75, 1].forEach(function (f) {
            var v = f * yMax, y = Y(v);
            out += '<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y +
                   '" stroke="#e6eef6" stroke-width="1.5"/>';
            out += '<text x="' + (padL - 12) + '" y="' + (y + 5) +
                   '" text-anchor="end" class="axis-txt">' + fmt(v) + (opts.yUnit || '') + '</text>';
        });

        out += '<line x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (padT + plotH) +
               '" stroke="#c9d9e8" stroke-width="2"/>';

        var d = points.map(function (p, i) {
            return (i ? 'L' : 'M') + X(p.x).toFixed(1) + ',' + Y(p.y).toFixed(1);
        }).join(' ');

        out += '<path d="' + d + '" fill="none" stroke="' + color +
               '" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"' +
               ' pathLength="1" class="line-path"/>';

        points.forEach(function (p, i) {
            out += '<circle cx="' + X(p.x) + '" cy="' + Y(p.y) + '" r="7" fill="#ffffff" stroke="' +
                   color + '" stroke-width="4" class="node" style="animation-delay:' +
                   (0.25 + 0.1 * i).toFixed(2) + 's"/>';
            out += '<text x="' + X(p.x) + '" y="' + (Y(p.y) - 18) +
                   '" text-anchor="middle" class="val-txt" style="animation-delay:' +
                   (0.34 + 0.1 * i).toFixed(2) + 's">' + p.y + '</text>';
            out += '<text x="' + X(p.x) + '" y="' + (H - padB + 30) +
                   '" text-anchor="middle" class="cat-txt">' + p.x + '</text>';
        });

        out += '</svg>';
        return out;
    }

    /* ================================================================
       THEMES  (real, current data)
       ================================================================ */
    var THEMES = [

        /* ---------------- 1 · REMOTE WORK ---------------- */
        {
            kicker: 'Trend 1 · Work',
            title: 'The office is optional — for some',
            lede: 'Return-to-office headlines are loud, but the data tells a quieter story: hybrid work is now the default for people whose jobs can be done remotely.',
            chart: hBarChart([
                { label: 'Hybrid',              value: 43 },
                { label: 'Fully remote',        value: 32 },
                { label: 'Fully in-office',     value: 25 }
            ], { max: 50, unit: '%', accent: '#0f766e', base: '#a4cec4',
                 xTitle: 'Share of remote-capable employees, 2025',
                 aria: 'Share of remote-capable employees working hybrid, fully remote or fully in-office' }),
            source: 'Source: Pew Research Center, 2025 (remote-capable employees). 46% of hybrid workers say they would be unlikely to stay if remote flexibility were removed entirely.',
            questions: [
                'If remote flexibility disappeared tomorrow, would you stay at your job — or leave? What does that say about the real "salary" of flexibility?',
                'Companies say they want people back for collaboration and culture. Is this about productivity, or about control? What do you actually believe?',
                'Hybrid is now the default. But who gets left behind in a hybrid world — and does anyone truly win?'
            ]
        },

        /* ---------------- 2 · AI AT WORK ---------------- */
        {
            kicker: 'Trend 2 · Technology',
            title: 'AI at work: everyone talks, few use it daily',
            lede: 'More than half of workers have tried AI on the job. But daily use is still rare — and that gap may matter more than the hype.',
            chart: vBarChart([
                { label: 'Used AI in past year', value: 54, sub: 'at work' },
                { label: 'Use GenAI daily',      value: 14 }
            ], { yMax: 100, yUnit: '%', accent: '#1d4ed8', base: '#9dbcda',
                 yTitle: '% of workers',
                 aria: 'Share of workers who used AI in the past year versus those who use GenAI daily' }),
            source: 'Source: PwC Global Workforce Hopes and Fears Survey 2025 (nearly 50,000 employees, 48 countries). About three-quarters of AI users say it increases productivity.',
            questions: [
                'If AI does half your job, should your salary drop by half — or should you be paid for what you do with AI?',
                'Only 14% use GenAI daily. Is the other 40% who tried it once just experimenting — or already falling behind?',
                'If AI makes work faster, why are we not working less? Who is actually capturing the gains?'
            ]
        },

        /* ---------------- 3 · SOCIAL MEDIA TIME ---------------- */
        {
            kicker: 'Trend 3 · Attention',
            title: 'The average day on social media',
            lede: 'Social media is not just something we check. For many adults, it is now a parallel daily routine measured in hours.',
            chart: hBarChart([
                { label: 'Global average',  value: 141, sub: 'minutes / day' },
                { label: 'United States',   value: 136, sub: 'minutes / day' },
                { label: 'Brazil',          value: 229, sub: 'minutes / day' }
            ], { max: 250, unit: ' min', accent: '#b45309', base: '#e0bfa0',
                 xTitle: 'Average daily minutes on social media, 2025',
                 aria: 'Average daily minutes spent on social media: global, US and Brazil' }),
            source: 'Source: Statista / Digital 2025 (GWI). Global average: 2 h 21 min. Brazil: 3 h 49 min. US: 2 h 16 min.',
            questions: [
                'We spend 141 minutes a day on social media. Is that a problem of time, or a problem of attention?',
                'Brazil averages 3 h 49 min, the US 2 h 16 min. Is more time online a sign of a more connected culture — or a more distracted one?',
                'If social media disappeared tomorrow, what would you actually miss — and what would you secretly be relieved to lose?'
            ]
        },

        /* ---------------- 4 · LONELINESS ---------------- */
        {
            kicker: 'Trend 4 · Connection',
            title: 'Lonely in a connected world',
            lede: 'Loneliness is no longer a private feeling. It is measured, tracked, and increasingly treated as a public health issue.',
            chart: hBarChart([
                { label: 'US adults (weekly)',    value: 33, sub: 'lonely at least weekly' },
                { label: 'Worldwide (any)',       value: 16, sub: 'experienced loneliness' }
            ], { max: 50, unit: '%', accent: '#db2777', base: '#f4b8cf',
                 xTitle: 'Share of adults reporting loneliness, 2025',
                 aria: 'Share of US adults and people worldwide reporting loneliness' }),
            source: 'Source: American Psychiatric Association poll, 2025 (33% of US adults feel lonely at least weekly); WHO, 2025 (about 16% of people worldwide experience loneliness).',
            questions: [
                'One in three US adults feels lonely weekly, yet we are more "connected" than ever. What is connection actually supposed to feel like?',
                'Young adults are consistently the loneliest group. Is technology the cause — or is something else going on?',
                'Loneliness is now called an epidemic. Should governments treat it like smoking — with warnings and taxes — or is that overreach?'
            ]
        },

        /* ---------------- 5 · FERTILITY DECLINE ---------------- */
        {
            kicker: 'Trend 5 · Population',
            title: 'Fewer children, by choice or by barrier',
            lede: 'Global fertility has fallen from about 5 children per woman in 1950 to 2.3 today. In many countries, it is now well below the replacement level.',
            chart: vBarChart([
                { label: 'Global 1950',      value: 5.0, sub: 'children / woman' },
                { label: 'Global 2025',      value: 2.3 },
                { label: 'United States 2025', value: 1.6 },
                { label: 'Replacement level',  value: 2.1, sub: 'needed to sustain population' }
            ], { yMax: 6, yUnit: '', accent: '#4f46e5', base: '#c7d2fe',
                 yTitle: 'Children per woman',
                 aria: 'Fertility rate: global 1950, global 2025, US 2025 and replacement level' }),
            source: 'Source: UN World Population Prospects 2024 / Pew Research Center, 2025. Replacement level is about 2.1 children per woman.',
            questions: [
                'Global fertility has halved since 1950. Is this a crisis, a correction, or simply a choice people are finally free to make?',
                'If people say they want more children than they actually have, what is really stopping them — money, time, or something harder to name?',
                'Countries are now paying people to have children. Does that work — or does it miss the point entirely?'
            ]
        }
    ];

    /* ================================================================
       APP STATE
       ================================================================ */
    var idx = 0;

    var stage = document.getElementById('stage');
    var dotsEl = document.getElementById('dots');
    var modalBg = document.getElementById('modalBg');
    var modalTitle = document.getElementById('modalTitle');
    var modalText = document.getElementById('modalText');
    var confirmMove = document.getElementById('confirmMove');
    var cancelMove = document.getElementById('cancelMove');

    /* ================================================================
       RENDER
       ================================================================ */
    function renderDots() {
        var html = '';
        for (var i = 0; i < THEMES.length; i++) {
            var cls = 'pdot';
            if (i < idx) cls += ' done';
            if (i === idx && idx < THEMES.length) cls += ' active';
            html += '<span class="' + cls + '"></span>';
        }
        dotsEl.innerHTML = html;
    }

    function renderTheme() {
        if (idx >= THEMES.length) { renderFinish(); return; }
        var t = THEMES[idx];

        var questionsHtml = t.questions.map(function (q) {
            return '<li>' + esc(q) + '</li>';
        }).join('');

        stage.innerHTML =
            '<section class="card">' +
                '<div class="card-top">' +
                    '<span class="kicker">' + esc(t.kicker) + '</span>' +
                    '<span class="counter">' + (idx + 1) + ' / ' + THEMES.length + '</span>' +
                '</div>' +
                '<h2 class="title">' + esc(t.title) + '</h2>' +
                '<p class="lede">' + esc(t.lede) + '</p>' +

                '<div class="chart-card">' +
                    t.chart +
                    '<div class="chart-foot"><i class="fas fa-circle-info"></i> ' +
                        esc(t.source) + '</div>' +
                '</div>' +

                '<div class="talk">' +
                    '<h3 class="talk-title"><i class="fas fa-comments"></i> Provocative questions</h3>' +
                    '<ol class="qlist">' + questionsHtml + '</ol>' +
                '</div>' +

                '<div class="cta">' +
                    '<button type="button" class="got-it" id="gotIt">' +
                        '<span>We got it!</span><i class="fas fa-check"></i>' +
                    '</button>' +
                    '<p class="cta-hint">Click when your group has reacted to at least one question.</p>' +
                '</div>' +
            '</section>';

        renderDots();
        document.getElementById('gotIt').addEventListener('click', openModal);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderFinish() {
        stage.innerHTML =
            '<section class="card finish">' +
                '<div class="finish-emoji">🌍</div>' +
                '<h2>That is five trends.</h2>' +
                '<p>Which number surprised your group the most — and which one do you think will look completely different five years from now?</p>' +
                '<div class="cta">' +
                    '<button type="button" class="got-it" id="againBtn">' +
                        '<i class="fas fa-rotate-left"></i><span>Start again</span>' +
                    '</button>' +
                '</div>' +
            '</section>';

        renderDots();
        document.getElementById('againBtn').addEventListener('click', function () {
            idx = 0;
            renderTheme();
        });
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ================================================================
       MODAL
       ================================================================ */
    function openModal() {
        var isLast = idx === THEMES.length - 1;
        modalTitle.textContent = isLast ? 'Finish the activity?' : 'Move to the next trend?';
        modalText.textContent = isLast
            ? 'Make sure everyone has had a chance to react to at least one of the questions.'
            : 'Make sure everyone has had a chance to react to at least one of the questions.';
        confirmMove.innerHTML = isLast
            ? 'Yes, finish <i class="fas fa-flag-checkered"></i>'
            : 'Yes, next <i class="fas fa-arrow-right"></i>';

        modalBg.classList.add('show');
        modalBg.setAttribute('aria-hidden', 'false');
        setTimeout(function () { confirmMove.focus(); }, 60);
    }

    function closeModal() {
        modalBg.classList.remove('show');
        modalBg.setAttribute('aria-hidden', 'true');
        var btn = document.getElementById('gotIt');
        if (btn) btn.focus();
    }

    confirmMove.addEventListener('click', function () {
        closeModal();
        idx += 1;
        renderTheme();
    });
    cancelMove.addEventListener('click', closeModal);

    modalBg.addEventListener('click', function (e) {
        if (e.target === modalBg) closeModal();
    });

    document.addEventListener('keydown', function (e) {
        if (!modalBg.classList.contains('show')) return;
        if (e.key === 'Escape') closeModal();
        if (e.key === 'Enter') confirmMove.click();
    });

    /* ================================================================
       BOOT
       ================================================================ */
    renderTheme();

})();
</script>

</body>
</html>
