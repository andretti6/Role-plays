<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🧑‍🏫 Teacher Panel · Sustainable Career</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05070a;--ink:#e9eef4;--muted:#7f8b9b;--dim:#57616e;
  --line:rgba(255,255,255,.085);--line-strong:rgba(255,255,255,.16);
  --accent:#6ee7b7;--accent-2:#38bdf8;--gold:#fbbf24;
  --red:#f87171;--green:#34d399;
  --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::selection{background:rgba(110,231,183,.28)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:8px}

/* Ambient */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:.35}
.orb-1{width:50vw;height:50vw;left:-15vw;top:-18vw;background:radial-gradient(circle,rgba(110,231,183,.22),transparent 68%)}
.orb-2{width:44vw;height:44vw;right:-14vw;bottom:-20vw;background:radial-gradient(circle,rgba(56,189,248,.16),transparent 68%)}
.grid-ov{
  position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:52px 52px;
  -webkit-mask-image:radial-gradient(ellipse 92% 75% at 50% 35%,#000 20%,transparent 80%);
  mask-image:radial-gradient(ellipse 92% 75% at 50% 35%,#000 20%,transparent 80%);
}

.page{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:32px 24px 80px}

/* Header */
.hdr{
  display:flex;justify-content:space-between;align-items:flex-end;gap:24px;
  flex-wrap:wrap;margin-bottom:26px;
}
.hdr h1{
  font-size:clamp(26px,3.2vw,36px);font-weight:900;letter-spacing:-.03em;line-height:1.05;
  background:linear-gradient(180deg,#fff 20%,#9fb0c4 120%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:6px;
}
.hdr .sub{font-size:13.5px;color:var(--muted);font-weight:300}
.hdr .eyebrow{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);font-weight:800;margin-bottom:10px}

.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.session-input{
  display:flex;align-items:center;gap:8px;
  padding:9px 14px;border-radius:12px;
  border:1px solid var(--line);background:rgba(255,255,255,.02);
}
.session-input label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:800}
.session-input input{
  font-family:inherit;font-size:13px;font-weight:500;
  background:transparent;border:none;outline:none;color:var(--ink);
  width:130px;
}

.btn{
  font-family:inherit;font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  padding:11px 18px;border-radius:11px;cursor:pointer;
  border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);
  transition:.22s;display:inline-flex;align-items:center;gap:8px;
  -webkit-tap-highlight-color:transparent;
}
.btn:hover{background:rgba(255,255,255,.08);border-color:var(--line-strong);transform:translateY(-1px)}
.btn-primary{
  border-color:rgba(110,231,183,.5);color:var(--accent);
  background:linear-gradient(135deg,rgba(110,231,183,.14),rgba(110,231,183,.04));
  box-shadow:0 0 22px -8px rgba(110,231,183,.7);
}
.btn-primary:hover{background:rgba(110,231,183,.2);box-shadow:0 0 32px -6px rgba(110,231,183,.9)}
.btn-danger{border-color:rgba(248,113,113,.35);color:#fca5a5}
.btn-danger:hover{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.6)}
.btn-sm{padding:8px 13px;font-size:10.5px;border-radius:9px}

/* Stats bar */
.stats-bar{
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  padding:16px 20px;border-radius:16px;margin-bottom:22px;
  border:1px solid var(--line);background:linear-gradient(165deg,rgba(255,255,255,.03),rgba(255,255,255,.006));
}
.stat{display:flex;align-items:center;gap:10px}
.stat .si{font-size:20px;filter:drop-shadow(0 0 10px rgba(110,231,183,.4))}
.stat .sv{font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat .sl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:800}
.stat-sep{width:1px;height:26px;background:var(--line)}

.live-dot{
  display:inline-flex;align-items:center;gap:7px;margin-left:auto;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-weight:700;
}
.live-dot .d{
  width:8px;height:8px;border-radius:50%;background:var(--green);
  box-shadow:0 0 12px rgba(110,231,183,.9);animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}

/* Actions */
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:24px}

/* Rooms grid */
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.room{
  border:1px solid var(--line);border-radius:20px;overflow:hidden;
  background:linear-gradient(165deg,rgba(255,255,255,.035),rgba(255,255,255,.006));
  transition:.3s cubic-bezier(.2,.7,.3,1);position:relative;
}
.room:hover{border-color:var(--line-strong)}
.room.locked{border-color:rgba(251,191,36,.35)}
.room.locked::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(251,191,36,.7),transparent);
}
.room-header{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.055);
}
.room-title{display:flex;align-items:center;gap:12px;min-width:0}
.room-num{
  width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;
  font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,rgba(110,231,183,.18),rgba(110,231,183,.04));
  border:1px solid rgba(110,231,183,.28);color:var(--accent);
  overflow:hidden;text-overflow:ellipsis;
}
.room.locked .room-num{
  background:linear-gradient(135deg,rgba(251,191,36,.18),rgba(251,191,36,.04));
  border-color:rgba(251,191,36,.35);color:var(--gold);
}
.room-name{font-size:14.5px;font-weight:700;letter-spacing:-.01em;word-break:break-all}
.room-meta{font-size:11px;color:var(--dim);letter-spacing:.06em;margin-top:2px;font-weight:500}
.room-meta b{color:var(--muted);font-weight:700}
.room-status{
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;
  padding:5px 11px;border-radius:999px;
  border:1px solid rgba(110,231,183,.35);background:rgba(110,231,183,.08);color:var(--accent);
  white-space:nowrap;
}
.room.locked .room-status{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08);color:var(--gold)}
.room-actions{display:flex;gap:6px;margin-left:auto}
.icon-btn{
  width:32px;height:32px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);
  font-size:13px;transition:.22s;display:grid;place-items:center;
  -webkit-tap-highlight-color:transparent;
}
.icon-btn:hover{color:var(--ink);border-color:var(--line-strong);background:rgba(255,255,255,.08)}
.icon-btn.danger:hover{color:#fca5a5;border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.1)}

.room-body{padding:8px}
.players-list{display:flex;flex-direction:column;gap:6px}
.player{
  display:flex;align-items:center;gap:11px;
  padding:11px 13px;border-radius:12px;
  border:1px solid transparent;background:rgba(255,255,255,.022);
  transition:.22s;
}
.player:hover{background:rgba(255,255,255,.05);border-color:var(--line)}
.player-av{
  width:34px;height:34px;flex:0 0 34px;border-radius:10px;
  display:grid;place-items:center;font-size:16px;font-weight:800;
  background:linear-gradient(135deg,rgba(110,231,183,.14),rgba(56,189,248,.06));
  border:1px solid rgba(110,231,183,.24);color:var(--accent);
}
.player-info{flex:1;min-width:0}
.player-name{
  font-size:13.5px;font-weight:600;color:#e4ecf4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.player-role{
  font-size:11px;color:var(--muted);font-weight:400;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-top:1px;
}
.player-kick{
  width:28px;height:28px;border-radius:8px;cursor:pointer;
  border:1px solid rgba(248,113,113,.25);background:rgba(248,113,113,.06);
  color:#fca5a5;font-size:12px;font-weight:800;
  display:grid;place-items:center;transition:.22s;
  -webkit-tap-highlight-color:transparent;
}
.player-kick:hover{background:rgba(248,113,113,.18);border-color:rgba(248,113,113,.6);color:#fff}

.empty-state{padding:22px 16px;text-align:center;font-size:12.5px;color:var(--dim);font-style:italic}

.global-empty{
  padding:70px 32px;text-align:center;
  border:1px dashed var(--line-strong);border-radius:20px;
  background:rgba(255,255,255,.012);
}
.global-empty .ge-icon{font-size:52px;display:block;margin-bottom:16px;opacity:.65}
.global-empty h3{font-size:19px;font-weight:600;color:var(--muted);margin-bottom:8px}
.global-empty p{font-size:14px;color:var(--dim);max-width:440px;margin:0 auto}

/* Toast */
.toast-wrap{position:fixed;top:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:12px;
  padding:12px 18px;border-radius:13px;
  background:rgba(10,16,22,.95);backdrop-filter:blur(14px);
  border:1px solid rgba(110,231,183,.4);
  box-shadow:0 20px 60px -20px rgba(110,231,183,.6);
  animation:toastIn .45s cubic-bezier(.2,.9,.3,1) both;
  font-size:13px;font-weight:500;color:var(--ink);
  min-width:220px;
}
@keyframes toastIn{from{opacity:0;transform:translateX(40px) scale(.94)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .35s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(40px) scale(.94)}}
.toast .ti{font-size:20px}
.toast.error{border-color:rgba(248,113,113,.5);box-shadow:0 20px 60px -20px rgba(248,113,113,.6)}
.toast.success{border-color:rgba(110,231,183,.5);box-shadow:0 20px 60px -20px rgba(110,231,183,.6)}

@media (max-width:760px){
  .page{padding:24px 16px 60px}
  .hdr{flex-direction:column;align-items:stretch}
  .controls{justify-content:flex-start}
  .rooms{grid-template-columns:1fr}
  .stats-bar{padding:14px 16px;gap:12px}
  .stat .sv{font-size:17px}
  .toast-wrap{top:12px;right:12px;left:12px}
  .toast{min-width:0}
}
</style>
</head>
<body>

<div class="bg">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="grid-ov"></div>
</div>

<div class="page">

  <div class="hdr">
    <div>
      <div class="eyebrow">🧑‍🏫 Teacher Control</div>
      <h1>SUSTAINABLE CAREER</h1>
      <div class="sub">See every room, every player. Remove a player or wipe a room with one click.</div>
    </div>
    <div class="controls">
      <div class="session-input">
        <label>Session</label>
        <input id="sessionInput" type="text" value="default" spellcheck="false">
      </div>
      <button class="btn btn-primary" onclick="manualRefresh()">🔄 Refresh now</button>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat">
      <span class="si">👥</span>
      <div>
        <div class="sv" id="statPlayers">0</div>
        <div class="sl">Players</div>
      </div>
    </div>
    <div class="stat-sep"></div>
    <div class="stat">
      <span class="si">🚪</span>
      <div>
        <div class="sv" id="statRooms">0</div>
        <div class="sl">Rooms</div>
      </div>
    </div>
    <div class="stat-sep"></div>
    <div class="stat">
      <span class="si">🔒</span>
      <div>
        <div class="sv" id="statLocked">0</div>
        <div class="sl">In Game</div>
      </div>
    </div>
    <div class="live-dot" id="liveDot"><span class="d"></span> Live · refreshing every 2s</div>
  </div>

  <div class="actions">
    <button class="btn btn-danger" onclick="clearAllRooms()">🧹 Clear all rooms</button>
  </div>

  <div id="roomsContainer">
    <div class="global-empty">
      <span class="ge-icon">📡</span>
      <h3>Connecting to Firebase…</h3>
      <p>Waiting for players to join.</p>
    </div>
  </div>

</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ═══════════════════════════════════════════════════════
   CONFIG
   ═══════════════════════════════════════════════════════ */
const FIREBASE_URL = 'https://english-meetings-f08e4-default-rtdb.firebaseio.com';
const POLL_MS = 2000;

let state = {
  session: 'default',
  rooms: []
};
let pollTimer = null;

/* ═══════════════════════════════════════════════════════
   FIREBASE
   ═══════════════════════════════════════════════════════ */
function fbPath(p){ return FIREBASE_URL + '/' + p + '.json'; }

async function fbGet(p){
  const r = await fetch(fbPath(p));
  if(!r.ok) throw new Error('FB get failed');
  return await r.json();
}
async function fbDelete(p){
  const r = await fetch(fbPath(p), { method: 'DELETE' });
  return r.ok;
}

function basePath(){
  return 'sustainable/' + state.session;
}

/* ═══════════════════════════════════════════════════════
   FETCH + RENDER
   ═══════════════════════════════════════════════════════ */
async function fetchRooms(){
  try {
    const roomsPath = basePath() + '/rooms';
    const data = await fbGet(roomsPath) || {};
    const rooms = Object.entries(data).map(([id, r]) => {
      const players = r.players || {};
      const playerList = Object.entries(players).map(([pid, p]) => ({
        id: pid,
        name: p.name || 'Player',
        joinedAt: p.joinedAt || 0
      })).sort((a,b) => a.joinedAt - b.joinedAt || a.id.localeCompare(b.id));

      return {
        id,
        createdAt: r.createdAt || 0,
        locked: r.locked || false,
        currentRound: r.currentRound != null ? r.currentRound : -1,
        totalRounds: r.totalRounds || 0,
        players: playerList
      };
    });
    rooms.sort((a,b) => (a.createdAt || 0) - (b.createdAt || 0));
    state.rooms = rooms;
    render();
  } catch(err){
    console.error('fetchRooms failed', err);
  }
}

function render(){
  const container = document.getElementById('roomsContainer');
  const rooms = state.rooms;

  let totalPlayers = 0;
  let lockedCount = 0;
  rooms.forEach(r => {
    totalPlayers += r.players.length;
    if(r.locked) lockedCount++;
  });

  document.getElementById('statPlayers').textContent = totalPlayers;
  document.getElementById('statRooms').textContent = rooms.length;
  document.getElementById('statLocked').textContent = lockedCount;

  if(rooms.length === 0){
    container.innerHTML = `
      <div class="global-empty">
        <span class="ge-icon">🚪</span>
        <h3>No rooms yet</h3>
        <p>Students will appear here once they join with the session "${escapeHtml(state.session)}".</p>
      </div>
    `;
    return;
  }

  container.innerHTML = `<div class="rooms">${rooms.map((r, idx) => renderRoom(r, idx)).join('')}</div>`;
}

function renderRoom(room, idx){
  const count = room.players.length;
  const locked = room.locked;
  const roomClass = 'room' + (locked ? ' locked' : '');

  let status;
  if(locked){
    const roundNum = room.currentRound >= 0 ? room.currentRound + 1 : '?';
    status = 'In game · R' + roundNum;
  } else {
    status = count + ' / 3 ready';
  }

  const playersHtml = count === 0
    ? '<div class="empty-state">No players in this room.</div>'
    : '<div class="players-list">' + room.players.map(p => renderPlayer(p, room)).join('') + '</div>';

  return `
    <div class="${roomClass}">
      <div class="room-header">
        <div class="room-title">
          <div class="room-num" title="${escapeHtml(room.id)}">#${idx + 1}</div>
          <div style="min-width:0">
            <div class="room-name">Room ${idx + 1}</div>
            <div class="room-meta"><b>${count}</b> player${count === 1 ? '' : 's'}</div>
          </div>
        </div>
        <span class="room-status">${status}</span>
        <div class="room-actions">
          <button class="icon-btn danger" title="Delete entire room" onclick="confirmDeleteRoom('${room.id}', ${idx + 1})">🗑️</button>
        </div>
      </div>
      <div class="room-body">${playersHtml}</div>
    </div>
  `;
}

function renderPlayer(p, room){
  const initial = (p.name || '?').trim().charAt(0).toUpperCase();
  return `
    <div class="player">
      <div class="player-av">${escapeHtml(initial)}</div>
      <div class="player-info">
        <div class="player-name">${escapeHtml(p.name)}</div>
        <div class="player-role">Player</div>
      </div>
      <button class="player-kick" title="Remove player" onclick="confirmKick('${p.id}', '${escapeHtml(p.name)}', '${room.id}')">✕</button>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════
   ACTIONS
   ═══════════════════════════════════════════════════════ */
async function kickPlayer(playerId, playerName, roomId){
  try {
    const url = basePath() + '/rooms/' + roomId + '/players/' + playerId;
    await fbDelete(url);
    toast('Removed ' + playerName, 'success');
    await fetchRooms();
  } catch(err){
    console.error(err);
    toast('Could not remove player', 'error');
  }
}

function confirmKick(playerId, playerName, roomId){
  if(!confirm('Remove "' + playerName + '" from this room?')) return;
  kickPlayer(playerId, playerName, roomId);
}

async function deleteRoom(roomId, roomNum){
  try {
    const url = basePath() + '/rooms/' + roomId;
    await fbDelete(url);
    toast('Room ' + roomNum + ' deleted', 'success');
    await fetchRooms();
  } catch(err){
    console.error(err);
    toast('Could not delete room', 'error');
  }
}

function confirmDeleteRoom(roomId, roomNum){
  if(!confirm('Delete Room ' + roomNum + ' and remove all its players?')) return;
  deleteRoom(roomId, roomNum);
}

async function clearAllRooms(){
  if(!confirm('Delete ALL rooms in session "' + state.session + '"? This removes every player too.')) return;
  try {
    await fbDelete(basePath() + '/rooms');
    toast('All rooms cleared', 'success');
    await fetchRooms();
  } catch(err){
    console.error(err);
    toast('Could not clear rooms', 'error');
  }
}

/* ═══════════════════════════════════════════════════════
   SESSION SWITCH
   ═══════════════════════════════════════════════════════ */
document.getElementById('sessionInput').addEventListener('change', (e) => {
  const val = e.target.value.trim() || 'default';
  state.session = val;
  fetchRooms();
});

/* ═══════════════════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════════════════ */
function toast(msg, type = 'success'){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + (type === 'error' ? 'error' : 'success');
  el.innerHTML = `<span class="ti">${type === 'error' ? '⚠️' : '✅'}</span><span>${escapeHtml(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 400);
  }, 2400);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* ═══════════════════════════════════════════════════════
   REFRESH + POLLING
   ═══════════════════════════════════════════════════════ */
async function manualRefresh(){
  await fetchRooms();
  toast('Refreshed', 'success');
}

function startPolling(){
  stopPolling();
  pollTimer = setInterval(fetchRooms, POLL_MS);
}
function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}

/* ═══════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  const urlSession = new URLSearchParams(location.search).get('session');
  if(urlSession){
    state.session = urlSession;
    document.getElementById('sessionInput').value = urlSession;
  }
  fetchRooms();
  startPolling();
});
</script>
</body>
</html>
