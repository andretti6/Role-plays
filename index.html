<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baby Co. — Market Rescue</title>
<style>
  :root{
    --bg:#0a0c10; --fg:#f1f3f6; --muted:#79818f; --dim:#464e5c;
    --line:#1b2028; --card:#0f1318; --card2:#141a22;
    --accent:#f2b544; --red:#ef4444; --red-glow:rgba(239,68,68,.55);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:clamp(16px,3.5vw,40px)}
  .top{flex:0 0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:16px;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  .top .stepno{color:var(--muted)}

  .btn-primary{font:inherit;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    padding:14px 30px;border-radius:10px;border:0;cursor:pointer;background:var(--fg);color:#0a0c10}
  .btn-primary:hover{background:#fff}
  .btn-primary:disabled{opacity:.4;cursor:default}
  .btn-secondary{font:inherit;font-size:12px;font-weight:500;letter-spacing:.06em;
    padding:10px 18px;border-radius:10px;cursor:pointer;
    background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn-secondary:hover{color:var(--fg);border-color:#2b3340}

  main.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:14px;padding:20px}
  .brand{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .login-title{font-size:clamp(20px,2.8vw,28px);font-weight:600;letter-spacing:-.02em;margin-top:8px}
  .name-input{font:inherit;font-size:16px;width:min(320px,80vw);padding:14px 18px;border-radius:10px;
    border:1px solid var(--line);background:var(--card);color:var(--fg);text-align:center;outline:none}
  .name-input:focus{border-color:var(--muted)}
  .waiting-title{font-size:clamp(18px,2.4vw,24px);font-weight:600;letter-spacing:-.01em}
  .waiting-sub{font-size:13px;color:var(--muted);max-width:36ch}

  .timer{font-size:clamp(56px,min(13vw,15vh),140px);line-height:.9;font-weight:600;
    letter-spacing:-.045em;font-variant-numeric:tabular-nums;transition:color .3s ease;margin-top:8px}
  .timer.warn{color:var(--red);animation:shine 1.1s ease-in-out infinite}
  .timer.zero{color:#7a2d2d}
  @keyframes shine{
    0%,100%{text-shadow:0 0 0 var(--red-glow)}
    50%{text-shadow:0 0 24px var(--red-glow),0 0 48px var(--red-glow)}
  }

  main.room-main{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;
    gap:4px;padding:12px 0 20px;overflow-y:auto}
  .stepname{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);margin-top:8px}
  .brief{max-width:36ch;margin-top:16px;padding:12px 18px;border:1px solid var(--line);
    border-radius:10px;background:var(--card);color:#aab3c0;font-size:13px;line-height:1.55}
  .section-label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
    margin-top:20px;margin-bottom:6px}

  .roles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:680px}
  .role{font:inherit;font-size:12px;padding:8px 12px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:#9aa3b0;
    display:inline-flex;align-items:center;gap:6px;
    transition:background .18s,color .18s,border-color .18s}
  .role:hover:not(:disabled){border-color:#2b3340;color:var(--fg)}
  .role.on{background:var(--fg);color:#0a0c10;border-color:var(--fg);font-weight:600}
  .role.taken{opacity:.45;cursor:not-allowed}
  .ricon{font-size:14px}
  .rtaker{opacity:.75;font-size:10px;margin-left:2px}

  .questions{max-width:620px;display:flex;flex-direction:column;gap:6px;margin-top:4px}
  .q{font-size:12px;color:#9aa3b0;line-height:1.5;padding:7px 12px;
    border-left:2px solid var(--line);text-align:left}

  .team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:10px;max-width:720px;width:100%;margin-top:6px}
  .pcard{padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:left}
  .pcard.mine{border-color:var(--accent);background:linear-gradient(180deg,#1a1510,#121013)}
  .pcard.empty{opacity:.5}
  .picon{font-size:24px;line-height:1;margin-bottom:6px}
  .pname{font-size:13px;font-weight:600;color:var(--fg)}
  .prole{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:.05em;text-transform:uppercase}
  .pprompt{font-size:12px;color:#9aa3b0;margin-top:10px;line-height:1.5;
    border-top:1px solid var(--line);padding-top:8px}
  .pcard.mine .pprompt{color:#e5b46a}

  .roleplay-hint{max-width:560px;margin-top:20px;padding:14px 18px;border:1px solid var(--line);
    border-radius:10px;background:var(--card);text-align:left}
  .rh-title{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
  .rh-body{font-size:12px;color:#aab3c0;line-height:1.6}

  .structure{display:flex;flex-direction:column;gap:8px;max-width:340px;margin-top:6px;text-align:left}
  .srow{display:flex;gap:12px;align-items:baseline;font-size:14px;color:#c8ced6}
  .stime{font-size:11px;letter-spacing:.1em;color:var(--dim);width:32px;flex:0 0 auto;font-variant-numeric:tabular-nums}
  .sub{font-size:12px;color:var(--muted);margin-top:12px}
  .footer-hint{font-size:11px;color:var(--dim);letter-spacing:.08em;text-align:center;padding:12px 0 4px}

  main.teacher{flex:1;display:flex;flex-direction:column;gap:22px;padding:20px 0;overflow-y:auto;
    max-width:720px;width:100%;align-self:center}
  .seg{display:flex;gap:8px;margin-top:6px}
  .seg button{font:inherit;font-size:13px;width:44px;height:44px;border-radius:10px;
    border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--fg);color:#0a0c10;border-color:var(--fg);font-weight:600}

  .progress-step{font-size:32px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
  .progress-sub{font-size:12px;color:var(--muted);margin-top:4px}

  .student-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .student-row{display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
  .sname{font-size:14px;font-weight:500}
  .sroom{display:flex;gap:4px}
  .assign{font:inherit;font-size:11px;width:28px;height:28px;border-radius:8px;
    border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer}
  .assign.on{background:var(--fg);color:#0a0c10;border-color:var(--fg);font-weight:600}
  .assign:hover:not(.on){border-color:#2b3340;color:var(--muted)}
  .empty{font-size:12px;color:var(--dim);padding:10px 0}

  .room-line{display:flex;justify-content:space-between;align-items:baseline;
    padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;color:#c8ced6}
  .room-line [data-room-timer]{font-variant-numeric:tabular-nums;color:var(--muted)}
  .room-line [data-room-timer].warn{color:var(--red);font-weight:600}

  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}

  #modal{position:fixed;inset:0;z-index:100;pointer-events:none}
  #modal.open{pointer-events:auto}
  .modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.78);
    display:flex;align-items:center;justify-content:center;padding:20px}
  .modal-box{background:var(--card2);border:1px solid var(--line);border-radius:14px;
    padding:24px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:10px}
  .modal-title{font-size:16px;font-weight:600;letter-spacing:-.01em}
  .modal-body{font-size:13px;color:var(--muted);line-height:1.5}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}

  .model-backdrop{background:rgba(0,0,0,.9);align-items:flex-start;overflow-y:auto}
  .model-top{position:sticky;top:0;background:rgba(10,12,16,.96);backdrop-filter:blur(8px);
    display:flex;justify-content:space-between;align-items:center;padding:20px;
    border-bottom:1px solid var(--line);max-width:800px;width:100%;margin:0 auto;z-index:2}
  .model-title{font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
  .model-body{max-width:800px;margin:0 auto;padding:20px 20px 40px;display:flex;flex-direction:column;gap:24px}
  .model-step{padding:20px;background:var(--card);border:1px solid var(--line);border-radius:12px}
  .model-steplabel{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);
    margin-bottom:12px;font-weight:600}
  .model-stepbody{font-size:13px;color:#c8ced6;line-height:1.65}
  .model-stepbody p{margin:0 0 10px}
  .model-stepbody ul{margin:0 0 10px;padding-left:20px}
  .model-stepbody li{margin-bottom:4px}
  .dialogue{background:#0a0c10;border-left:2px solid var(--accent);padding:12px 16px;
    border-radius:6px;margin:10px 0;display:flex;flex-direction:column;gap:8px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .dialogue p{margin:0;color:#aab3c0}
  .who{color:var(--accent);font-weight:600}

  .err{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);padding:8px 16px;
    border-radius:8px;background:#5a1a1a;color:#fca5a5;font-size:12px;z-index:200}

  @media (max-width:520px){
    .timer{font-size:clamp(48px,18vw,80px)}
    .role{font-size:11px;padding:7px 10px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
(function(){
  'use strict';

  const FB = 'https://english-meetings-f08e4-default-rtdb.firebaseio.com';
  const TEACHER_NAME = 'andre prof';

  const STEPS = [
    { n:1, dur:600,  name:'Ideation',  title:'What does the company need?' },
    { n:2, dur:1200, name:'Role play', title:'Build one solution.' },
    { n:3, dur:1080, name:'Present',   title:'Present your plan.' }
  ];
  const BRIEF = 'A Chinese baby-products company is almost bankrupt. Help it sell more in China and Brazil.';

  const QUESTIONS = [
    'Who is the customer, exactly — a new parent? A grandparent?',
    'Why would a Brazilian parent NOT buy from us?',
    "What do we know that a Chinese brand wouldn't?",
    "What's the ONE thing you'd do with zero budget?",
    "Could the answer be: don't go to Brazil yet?"
  ];

  const ROLES = [
    { id:'ceo',     name:'CEO / Founder',            icon:'👑', prompt:'You have 6 months of cash. What is your call?' },
    { id:'china',   name:'China Sales',              icon:'🏭', prompt:'Your factory is underused. What do you need from Brazil?' },
    { id:'brazil',  name:'Brazil Launch',            icon:'🇧🇷', prompt:"Brazilian parents don't know us. What's the first trust signal?" },
    { id:'brand',   name:'Brand & Marketing',        icon:'🎯', prompt:'One line that makes a Brazilian parent care. Say it.' },
    { id:'safety',  name:'Safety & Certification',   icon:'🛡️', prompt:'What certification opens the door? What blocks it?' },
    { id:'supply',  name:'Supply Chain',             icon:'🚚', prompt:'China to Brazil: 45 days by sea. Can you live with that?' },
    { id:'pricing', name:'Pricing & Finance',        icon:'💰', prompt:'What price makes the math work? What price kills the deal?' },
    { id:'local',   name:'Localization',             icon:'🗣️', prompt:'What does a Brazilian parent need to hear in Portuguese?' },
    { id:'ecom',    name:'E-commerce & Live-selling',icon:'📱', prompt:'Live-selling works in China. Does it work in Brazil?' }
  ];

  const app = document.getElementById('app');
  const modal = document.getElementById('modal');

  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }
  function fmt(sec){
    sec = Math.max(0, Math.ceil(sec));
    const m = Math.floor(sec/60), s = sec % 60;
    return m + ':' + (s<10?'0':'') + s;
  }
  function genUid(){
    return 'u_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
  }

  function loadMe(){
    try { return JSON.parse(localStorage.getItem('bcm.me') || 'null'); }
    catch(e){ return null; }
  }
  function saveMe(m){
    if (m) localStorage.setItem('bcm.me', JSON.stringify(m));
    else localStorage.removeItem('bcm.me');
  }
  let me = loadMe();

  function isTeacher(){
    return !!(me && me.name && me.name.trim().toLowerCase() === TEACHER_NAME);
  }

  const state = {
    session: { started:false, startedAt:0, rooms:3 },
    users: {},
    rooms: {}
  };
  let lastKey = null;

  async function fbGet(path){
    const r = await fetch(FB + path + '.json', {cache:'no-store'});
    if (!r.ok) throw new Error('Firebase ' + r.status);
    return r.json();
  }
  async function fbPut(path, data){
    const r = await fetch(FB + path + '.json', { method:'PUT', body:JSON.stringify(data) });
    if (!r.ok) throw new Error('Firebase ' + r.status);
    return r.json();
  }
  async function fbPatch(path, data){
    const r = await fetch(FB + path + '.json', { method:'PATCH', body:JSON.stringify(data) });
    if (!r.ok) throw new Error('Firebase ' + r.status);
    return r.json();
  }
  async function fbDelete(path){
    await fetch(FB + path + '.json', { method:'DELETE' });
  }

  async function poll(){
    try {
      const [s,u,r] = await Promise.all([
        fbGet('/session'), fbGet('/users'), fbGet('/rooms')
      ]);
      state.session = s || {};
      if (!state.session.rooms) state.session.rooms = 3;
      if (state.session.started == null) state.session.started = false;
      state.users = u || {};
      state.rooms = r || {};
      clearErr();

      if (me && !state.users[me.uid]){
        try {
          await fbPut('/users/' + me.uid, {
            name: me.name, room: null, role: null, isTeacher: isTeacher()
          });
          state.users[me.uid] = { name: me.name, room: null, role: null, isTeacher: isTeacher() };
        } catch(e){}
      }
      render();
    } catch(e){
      showErr('Connection problem. Check internet.');
    }
  }
  let polling = false;
  function startPolling(){
    if (polling) return;
    polling = true;
    poll();
    setInterval(poll, 1500);
  }
  function showErr(msg){
    let el = document.getElementById('err');
    if (!el){ el = document.createElement('div'); el.id='err'; el.className='err'; document.body.appendChild(el); }
    el.textContent = msg;
  }
  function clearErr(){
    const el = document.getElementById('err');
    if (el) el.remove();
  }

  function computeKey(){
    if (!me) return 'login';
    if (isTeacher()){
      const users = Object.keys(state.users)
        .filter(id => !state.users[id].isTeacher)
        .sort()
        .map(id => id + ':' + (state.users[id].room||'') + ':' + (state.users[id].role||''))
        .join('|');
      const minStep = currentStep();
      return 'teacher:' + state.session.rooms + ':' + !!state.session.started + ':' + minStep + ':' + users;
    }
    const mu = state.users[me.uid];
    if (!mu) return 'unknown';
    if (!mu.room) return 'waiting:' + (state.session.started ? 's' : 'n');
    if (!state.session.started) return 'prestart:' + mu.room;
    const room = state.rooms[mu.room];
    if (!room) return 'noRoom:' + mu.room;
    const step = room.step || 1;
    const roommates = Object.keys(state.users)
      .filter(id => state.users[id].room == mu.room && !state.users[id].isTeacher)
      .sort()
      .map(id => id + ':' + (state.users[id].role||''))
      .join('|');
    return 'room:' + mu.room + ':' + step + ':' + roommates;
  }

  function currentStep(){
    const vals = Object.values(state.rooms).map(r => r.step || 1);
    return vals.length ? Math.min(...vals) : 0;
  }

  function render(){
    const key = computeKey();
    if (key !== lastKey){ lastKey = key; buildScreen(); }
    updateTimers();
  }

  function buildScreen(){
    if (!me){ buildLogin(); return; }
    if (isTeacher()){ buildTeacher(); return; }
    const mu = state.users[me.uid];
    if (!mu){ buildUnknown(); return; }
    if (!mu.room){ buildWaiting(); return; }
    if (!state.session.started){ buildPrestart(); return; }
    const room = state.rooms[mu.room];
    if (!room){ buildNoRoom(); return; }
    buildRoom();
  }

  function buildLogin(){
    app.innerHTML = `
      <main class="center">
        <div class="brand">BABY CO. — MARKET RESCUE</div>
        <div class="login-title">What's your name?</div>
        <input id="nameInput" class="name-input" placeholder="Your name" maxlength="30" autocomplete="off">
        <button class="btn-primary" id="joinBtn">Join</button>
      </main>`;
    const input = $('#nameInput');
    input.focus();
    input.addEventListener('keydown', e => { if (e.key === 'Enter') doJoin(); });
    $('#joinBtn').addEventListener('click', doJoin);

    async function doJoin(){
      const name = input.value.trim();
      if (!name) return;
      me = { uid: genUid(), name };
      saveMe(me);
      try {
        await fbPut('/users/' + me.uid, {
          name, room: null, role: null, isTeacher: isTeacher()
        });
        state.users[me.uid] = { name, room: null, role: null, isTeacher: isTeacher() };
      } catch(e){
        showErr('Could not join. Check connection.');
        return;
      }
      lastKey = null;
      render();
    }
  }

  function buildWaiting(){
    app.innerHTML = `
      <div class="top"><span>BABY CO.</span><span>${esc(me.name)}</span></div>
      <main class="center">
        <div class="waiting-title">Waiting for Andre</div>
        <div class="waiting-sub">He'll assign you to a room in a moment.</div>
        <button class="btn-secondary" id="logoutBtn">Leave</button>
      </main>`;
    $('#logoutBtn').addEventListener('click', logout);
  }

  function buildPrestart(){
    const mu = state.users[me.uid];
    app.innerHTML = `
      <div class="top"><span>ROOM ${mu.room}</span><span>${esc(me.name)}</span></div>
      <main class="center">
        <div class="waiting-title">You're in Room ${mu.room}</div>
        <div class="waiting-sub">Waiting for Andre to start the activity.</div>
        <button class="btn-secondary" id="logoutBtn">Leave</button>
      </main>`;
    $('#logoutBtn').addEventListener('click', logout);
  }

  function buildUnknown(){
    app.innerHTML = `
      <main class="center">
        <div class="waiting-title">Syncing…</div>
        <button class="btn-secondary" id="logoutBtn">Restart</button>
      </main>`;
    $('#logoutBtn').addEventListener('click', logout);
  }

  function buildNoRoom(){
    app.innerHTML = `<main class="center"><div class="waiting-title">Preparing your room…</div></main>`;
  }

  function buildTeacher(){
    const started = !!state.session.started;
    const roomCount = state.session.rooms || 3;
    const minStep = currentStep();

    const students = Object.keys(state.users)
      .filter(id => !state.users[id].isTeacher)
      .map(id => ({ id, ...state.users[id] }))
      .sort((a,b) => (a.name||'').localeCompare(b.name||''));

    let roomsStatus = '';
    if (started){
      for (let i = 1; i <= roomCount; i++){
        const r = state.rooms[i];
        if (!r) continue;
        roomsStatus += `<div class="room-line">
          <span>Room ${i} · Step ${r.step}</span>
          <span data-room-timer="${i}">--:--</span>
        </div>`;
      }
    }

    const studentHtml = students.length
      ? students.map(s => `
        <div class="student-row">
          <span class="sname">${esc(s.name)}</span>
          <span class="sroom">
            ${[1,2,3,4].map(n => `
              <button class="assign ${s.room===n?'on':''}" data-uid="${s.id}" data-r="${n}">${n}</button>
            `).join('')}
          </span>
        </div>`).join('')
      : '<div class="empty">No students yet. Share the link.</div>';

    const progressHtml = started ? `
      <div class="section">
        <div class="section-label">Progress</div>
        <div class="progress-step">
          ${minStep > 3 ? 'All done' : 'Step ' + minStep + ' of 3'}
        </div>
        <div class="progress-sub">
          ${minStep > 3
            ? 'Every room is on the done screen.'
            : (STEPS[minStep-1] ? STEPS[minStep-1].name + ' · ' + Math.round(STEPS[minStep-1].dur/60) + ' min' : '')}
        </div>
        ${minStep <= 3 ? `
          <div class="actions">
            <button class="btn-primary" id="advanceBtn">
              ${minStep < 3 ? 'Advance all rooms to Step ' + (minStep+1) : 'Finish activity'}
            </button>
          </div>
        ` : ''}
      </div>
    ` : `
      <div class="section">
        <div class="section-label">Rooms</div>
        <div class="seg" id="segRooms">
          ${[1,2,3,4].map(n => `<button data-n="${n}" class="${n===roomCount?'on':''}">${n}</button>`).join('')}
        </div>
      </div>
    `;

    app.innerHTML = `
      <div class="top"><span>BABY CO. — TEACHER</span><span>${started?'Live':'Setup'}</span></div>
      <main class="teacher">
        ${progressHtml}
        <div class="section">
          <div class="section-label">Students (${students.length})</div>
          <div class="student-list">${studentHtml}</div>
        </div>
        ${started ? `<div class="section">
          <div class="section-label">Room status</div>
          ${roomsStatus || '<div class="empty">No rooms active.</div>'}
        </div>` : ''}
        <div class="actions">
          ${!started ? `<button class="btn-primary" id="startBtn">Start activity</button>` : ''}
          <button class="btn-secondary" id="modelBtn">Model presentation</button>
          ${started ? `<button class="btn-secondary" id="resetBtn">Reset</button>` : ''}
          <button class="btn-secondary" id="logoutBtn">Leave</button>
        </div>
      </main>`;

    const seg = $('#segRooms');
    if (seg){
      seg.addEventListener('click', async e => {
        const b = e.target.closest('button');
        if (!b) return;
        const n = Number(b.dataset.n);
        if (n === roomCount) return;
        state.session.rooms = n;
        lastKey = null;
        render();
        try { await fbPatch('/session', { rooms: n }); } catch(err){}
      });
    }

    $$('.assign').forEach(b => {
      b.addEventListener('click', async () => {
        const uid = b.dataset.uid;
        const r = Number(b.dataset.r);
        if (state.users[uid]) state.users[uid].room = r;
        lastKey = null;
        render();
        try { await fbPatch('/users/' + uid, { room: r }); } catch(err){}
      });
    });

    const startBtn = $('#startBtn');
    if (startBtn) startBtn.addEventListener('click', startActivity);

    const advanceBtn = $('#advanceBtn');
    if (advanceBtn){
      advanceBtn.addEventListener('click', () => {
        const target = minStep + 1;
        showConfirm({
          title: minStep < 3
            ? 'Move all rooms to Step ' + target + '?'
            : 'Finish the activity?',
          body: minStep < 3
            ? 'Every room jumps to Step ' + target + ' (' + STEPS[target-1].name + '). All timers reset to ' + Math.round(STEPS[target-1].dur/60) + ' min. This is the only way to change steps.'
            : 'Every room will show the done screen.',
          yes: 'Confirm', no: 'Cancel',
          onYes: () => advanceAllRooms(target)
        });
      });
    }

    $('#modelBtn').addEventListener('click', showModel);
    const resetBtn = $('#resetBtn');
    if (resetBtn) resetBtn.addEventListener('click', resetSession);
    $('#logoutBtn').addEventListener('click', logout);
  }

  function getRoommates(){
    const mu = state.users[me.uid];
    if (!mu) return [];
    return Object.keys(state.users)
      .filter(id => state.users[id].room == mu.room && !state.users[id].isTeacher)
      .map(id => ({ uid:id, name: state.users[id].name, role: state.users[id].role }));
  }

  function buildRoom(){
    const mu = state.users[me.uid];
    const room = state.rooms[mu.room];
    const step = room.step || 1;

    if (step >= 4){
      app.innerHTML = `
        <div class="top"><span>ROOM ${mu.room}</span><span>DONE</span></div>
        <main class="center">
          <div class="waiting-title">Done.</div>
          <div class="waiting-sub">Thank you. See you in the debrief.</div>
        </main>`;
      return;
    }

    const info = STEPS[step - 1];
    let content = '';
    if (step === 1) content = step1Html();
    else if (step === 2) content = step2Html();
    else content = step3Html();

    app.innerHTML = `
      <div class="top">
        <span>ROOM ${mu.room} · ${esc(me.name)}</span>
        <span class="stepno">STEP ${step} / 3</span>
      </div>
      <main class="room-main">
        <div class="timer" id="timer">--:--</div>
        <div class="stepname">${info.name}</div>
        ${content}
      </main>
      <div class="footer-hint">Andre moves the room to the next step when the group is ready.</div>`;

    if (step === 1) wireStep1();
  }

  function step1Html(){
    const roommates = getRoommates();
    const roleHtml = ROLES.map(r => {
      const taker = roommates.find(m => m.role === r.id);
      const mine = taker && taker.uid === me.uid;
      const other = taker && !mine;
      return `<button class="role ${mine?'on':''} ${other?'taken':''}" data-r="${r.id}" ${other?'disabled':''}>
        <span class="ricon">${r.icon}</span>
        <span>${esc(r.name)}</span>
        ${other ? `<span class="rtaker">${esc(taker.name)}</span>` : ''}
      </button>`;
    }).join('');

    return `
      <div class="brief">${esc(BRIEF)}</div>
      <div class="section-label">Pick your role</div>
      <div class="roles" id="roles">${roleHtml}</div>
      <div class="section-label">Ask each other</div>
      <div class="questions">
        ${QUESTIONS.map(q => `<div class="q">${esc(q)}</div>`).join('')}
      </div>`;
  }

  function wireStep1(){
    $$('#roles .role').forEach(b => {
      b.addEventListener('click', async () => {
        if (b.disabled) return;
        const rid = b.dataset.r;
        const mu = state.users[me.uid];
        if (!mu) return;
        const newRole = mu.role === rid ? null : rid;
        state.users[me.uid] = { ...mu, role: newRole };
        lastKey = null;
        render();
        try { await fbPatch('/users/' + me.uid, { role: newRole }); }
        catch(e){ showErr('Sync failed.'); }
      });
    });
  }

  function step2Html(){
    const mu = state.users[me.uid];
    const roommates = getRoommates();
    const cards = roommates.map(m => {
      const role = ROLES.find(r => r.id === m.role);
      const mine = m.uid === me.uid;
      if (!role){
        return `<div class="pcard empty">
          <div class="picon">·</div>
          <div class="pname">${esc(m.name)}</div>
          <div class="prole">No role picked</div>
        </div>`;
      }
      return `<div class="pcard ${mine?'mine':''}">
        <div class="picon">${role.icon}</div>
        <div class="pname">${esc(m.name)}${mine?' (you)':''}</div>
        <div class="prole">${esc(role.name)}</div>
        <div class="pprompt">${esc(role.prompt)}</div>
      </div>`;
    }).join('');

    const myRole = ROLES.find(r => r.id === mu.role);
    const myLine = myRole
      ? `I'm ${esc(me.name)}, I handle ${esc(myRole.name)}. Here's what I see…`
      : `I'm ${esc(me.name)}. Here's what I see…`;

    return `
      <div class="section-label">Your team</div>
      <div class="team-grid">${cards || '<div class="empty">No one else yet.</div>'}</div>
      <div class="roleplay-hint">
        <div class="rh-title">How to play</div>
        <div class="rh-body">
          Introduce yourself in role. Then argue — from your role's point of view, not yours.
          <br><br>“${myLine}”
        </div>
      </div>`;
  }

  function step3Html(){
    const n = state.session.rooms || 3;
    const perRoomMin = STEPS[2].dur / n / 60;
    const half = perRoomMin / 2;
    const hstr = (Number.isInteger(half) ? half : half.toFixed(1)) + ' min';
    return `
      <div class="section-label">Structure</div>
      <div class="structure">
        <div class="srow"><span class="stime">30s</span> The problem</div>
        <div class="srow"><span class="stime">60s</span> The plan</div>
        <div class="srow"><span class="stime">60s</span> The bet</div>
        <div class="srow"><span class="stime">30s</span> The ask</div>
      </div>
      <div class="sub">${hstr} talk + ${hstr} questions per room</div>`;
  }

  async function advanceAllRooms(target){
    const now = Date.now();
    const updates = {};
    Object.keys(state.rooms).forEach(n => {
      updates[n] = { step: target, stepStartedAt: now };
    });
    try {
      await fbPut('/rooms', updates);
      state.rooms = updates;
      lastKey = null;
      render();
    } catch(e){
      showErr('Could not advance.');
    }
  }

  async function startActivity(){
    const n = state.session.rooms || 3;
    const now = Date.now();
    const roomsInit = {};
    for (let i = 1; i <= n; i++) roomsInit[i] = { step: 1, stepStartedAt: now };
    try {
      await fbPut('/rooms', roomsInit);
      await fbPatch('/session', { started: true, startedAt: now });
      state.session.started = true;
      state.session.startedAt = now;
      state.rooms = roomsInit;
      lastKey = null;
      render();
    } catch(e){
      showErr('Could not start.');
    }
  }

  async function resetSession(){
    if (!confirm('Reset the session? Rooms and progress will clear.')) return;
    try {
      await fbPatch('/session', { started: false, startedAt: 0 });
      await fbDelete('/rooms');
      state.session.started = false;
      state.session.startedAt = 0;
      state.rooms = {};
      lastKey = null;
      render();
    } catch(e){}
  }

  async function logout(){
    const oldUid = me && me.uid;
    me = null;
    saveMe(null);
    lastKey = null;
    if (oldUid) delete state.users[oldUid];
    render();
    if (oldUid){ try { await fbDelete('/users/' + oldUid); } catch(e){} }
  }

  function showConfirm({title, body, yes, no, onYes}){
    modal.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-box">
          <div class="modal-title">${esc(title)}</div>
          <div class="modal-body">${esc(body)}</div>
          <div class="modal-actions">
            <button class="btn-secondary" id="mNo">${esc(no)}</button>
            <button class="btn-primary" id="mYes">${esc(yes)}</button>
          </div>
        </div>
      </div>`;
    modal.classList.add('open');
    $('#mNo').addEventListener('click', closeModal);
    $('#mYes').addEventListener('click', async () => { closeModal(); await onYes(); });
  }
  function closeModal(){
    modal.classList.remove('open');
    modal.innerHTML = '';
  }
  document.addEventListener('click', e => {
    if (e.target.classList && e.target.classList.contains('modal-backdrop')
        && !e.target.classList.contains('model-backdrop')){
      closeModal();
    }
  });

  function showModel(){
    modal.innerHTML = `
      <div class="modal-backdrop model-backdrop">
        <div style="width:100%">
          <div class="model-top">
            <div class="model-title">Model presentation</div>
            <button class="btn-secondary" id="modelClose">Close</button>
          </div>
          <div class="model-body">
            <div class="model-step">
              <div class="model-steplabel">Step 1 · Ideation · 10 min</div>
              <div class="model-stepbody">
                <p><strong>Prompt:</strong> A Chinese baby company is almost bankrupt. Help it sell more in China and Brazil.</p>
                <p><strong>Sample questions to ask each other:</strong></p>
                <ul>
                  <li>Who is the customer, exactly?</li>
                  <li>Why would a Brazilian parent NOT buy from us?</li>
                  <li>What do we know that a Chinese brand wouldn't?</li>
                  <li>What's the ONE thing you'd do with zero budget?</li>
                </ul>
                <p><strong>Sample output:</strong> "We need (1) a partner in Brazil, (2) one hero product, (3) trust signals — safety certification, reviews, a local voice."</p>
              </div>
            </div>
            <div class="model-step">
              <div class="model-steplabel">Step 2 · Role play · 20 min</div>
              <div class="model-stepbody">
                <p><strong>Sample roles:</strong> CEO · China Sales · Brazil Launch · Safety · Pricing.</p>
                <p><strong>Sample dialogue:</strong></p>
                <div class="dialogue">
                  <p><span class="who">CEO:</span> We have 6 months of cash. Where do we spend it?</p>
                  <p><span class="who">China Sales:</span> Our factory can produce 3× more. Cost is low. Let's use that.</p>
                  <p><span class="who">Brazil Launch:</span> Brazilians don't know us. We need 90 days of trust-building before launch.</p>
                  <p><span class="who">Safety:</span> INMETRO certification takes 8–12 weeks. Start now or we don't launch.</p>
                  <p><span class="who">Pricing:</span> Landed cost plus 40%. Any lower and we lose on every unit.</p>
                </div>
              </div>
            </div>
            <div class="model-step">
              <div class="model-steplabel">Step 3 · Present · 18 min</div>
              <div class="model-stepbody">
                <p><strong>Sample 3-minute presentation:</strong></p>
                <div class="dialogue">
                  <p>"We're bleeding cash with China-only sales.</p>
                  <p>Our plan: enter Brazil with one hero product, a local partner, and safety certification.</p>
                  <p>The bet: 3 months, $200k, target 20k units.</p>
                  <p>The ask: sign the partner, ship 500 units as a pilot.</p>
                  <p>The risk: if it fails, we exit in 6 months. Thank you."</p>
                </div>
                <p>Then 3 minutes of questions. Answer in role.</p>
              </div>
            </div>
          </div>
        </div>
      </div>`;
    modal.classList.add('open');
    $('#modelClose').addEventListener('click', closeModal);
  }

  function updateTimers(){
    const t = $('#timer');
    if (t && me && !isTeacher()){
      const mu = state.users[me.uid];
      if (mu && mu.room){
        const r = state.rooms[mu.room];
        if (r && r.step && r.step <= 3){
          const step = STEPS[r.step - 1];
          const remaining = Math.max(0, step.dur - (Date.now() - r.stepStartedAt) / 1000);
          t.textContent = fmt(remaining);
          t.classList.toggle('warn', remaining <= 120 && remaining > 0);
          t.classList.toggle('zero', remaining <= 0);
        }
      }
    }
    $$('[data-room-timer]').forEach(el => {
      const n = el.dataset.roomTimer;
      const r = state.rooms[n];
      if (r && r.step && r.step <= 3){
        const step = STEPS[r.step - 1];
        const remaining = Math.max(0, step.dur - (Date.now() - r.stepStartedAt) / 1000);
        el.textContent = fmt(remaining);
        el.classList.toggle('warn', remaining <= 120 && remaining > 0);
      }
    });
  }

  render();
  startPolling();
  setInterval(updateTimers, 200);
})();
</script>
</body>
</html>
