<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Complete the Mission · 5 Travel & Work Missions</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Inter', sans-serif;
        background: #f2f6fb;
        background-image:
            radial-gradient(circle at 8% 0%, rgba(29, 78, 216, 0.09), transparent 42%),
            radial-gradient(circle at 95% 100%, rgba(13, 148, 136, 0.09), transparent 42%);
        background-attachment: fixed;
        color: #13202d;
        min-height: 100vh;
        padding: 24px 16px 60px;
    }

    .wrap { max-width: 980px; margin: 0 auto; }

    /* ---------- HEADER ---------- */
    .top {
        display: flex; align-items: center; justify-content: space-between;
        gap: 16px; flex-wrap: wrap; margin-bottom: 20px;
    }
    .brand { display: flex; align-items: center; gap: 13px; }
    .logo {
        width: 48px; height: 48px; border-radius: 15px;
        background: linear-gradient(135deg, #1d4ed8, #0d9488);
        color: #fff; display: flex; align-items: center; justify-content: center;
        font-size: 20px; box-shadow: 0 10px 22px rgba(29, 78, 216, 0.28);
        flex-shrink: 0;
    }
    .brand h1 { font-size: 19px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.2; }
    .brand p { font-size: 12px; color: #6b8299; font-weight: 600; margin-top: 2px; }

    .pdot-row { display: flex; gap: 7px; align-items: center; }
    .pdot {
        width: 10px; height: 10px; border-radius: 50%;
        background: #d3e0ee; transition: all 0.25s;
    }
    .pdot.done { background: #16a34a; }
    .pdot.active { background: #1d4ed8; width: 26px; border-radius: 6px; }

    /* ---------- CARD ---------- */
    .card {
        background: #ffffff; border: 1px solid #e6eef6; border-radius: 26px;
        padding: 28px;
        box-shadow: 0 20px 44px rgba(20, 45, 80, 0.10);
        animation: cardIn 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.05);
    }
    @keyframes cardIn {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: none; }
    }

    .card-top {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
    }
    .kicker {
        font-size: 11px; font-weight: 800; letter-spacing: 0.9px;
        text-transform: uppercase; color: #1d4ed8;
        background: #eaf1ff; padding: 5px 13px; border-radius: 30px;
    }
    .counter {
        font-size: 12px; font-weight: 800; color: #8098ad;
        background: #f2f7fc; padding: 5px 13px; border-radius: 30px;
    }
    .title {
        font-size: 27px; font-weight: 800; letter-spacing: -0.6px;
        line-height: 1.2; margin-bottom: 8px;
    }
    .lede {
        font-size: 15px; line-height: 1.6; color: #4a6580;
        font-weight: 500; margin-bottom: 18px;
    }

    /* ---------- MISSION BANNER ---------- */
    .mission-brief {
        display: flex; align-items: center; gap: 15px;
        background: linear-gradient(135deg, #1d4ed8, #16389b);
        color: #fff; border-radius: 16px; padding: 15px 20px;
        margin-bottom: 22px;
        box-shadow: 0 12px 26px rgba(29, 78, 216, 0.26);
    }
    .mission-brief > i { font-size: 22px; flex-shrink: 0; color: #ffd166; }
    .mission-brief strong { display: block; font-size: 13.5px; margin-bottom: 2px; letter-spacing: -0.1px; }
    .mission-brief span { font-size: 12.5px; opacity: 0.92; font-weight: 500; line-height: 1.45; }

    /* ---------- PROFILE BOARD ---------- */
    .profile-board {
        display: grid;
        grid-template-columns: 1fr 214px 1fr;
        gap: 14px;
        margin-bottom: 20px;
        align-items: center;
    }
    .profile-col { display: flex; flex-direction: column; gap: 10px; }
    .profile-center {
        display: flex; flex-direction: column; align-items: center;
        gap: 8px; text-align: center;
    }

    .photo-frame {
        width: 190px; height: 190px; border-radius: 24px;
        overflow: hidden; border: 4px solid #ffffff;
        box-shadow: 0 16px 36px rgba(20, 45, 80, 0.18);
        background: #eef3f9; position: relative;
    }
    .photo-frame img {
        width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .photo-fallback {
        display: none; width: 100%; height: 100%;
    }
    .photo-fallback svg { width: 100%; height: 100%; display: block; }
    .photo-frame.no-photo .photo-fallback { display: block; }
    .photo-frame.no-photo img { display: none; }

    .profile-name {
        font-size: 19px; font-weight: 800; letter-spacing: -0.3px;
        line-height: 1.2; margin-top: 2px;
    }
    .profile-tag {
        font-size: 10.5px; font-weight: 800; letter-spacing: 0.5px;
        text-transform: uppercase; color: #6b8299;
        background: #f2f7fc; padding: 4px 12px; border-radius: 30px;
        line-height: 1.4;
    }
    .budget-badge {
        display: inline-flex; align-items: center; gap: 8px;
        background: linear-gradient(135deg, #f59e0b, #d97706);
        color: #fff; font-size: 16px; font-weight: 800;
        padding: 9px 20px; border-radius: 40px; margin-top: 4px;
        box-shadow: 0 10px 22px rgba(217, 119, 6, 0.32);
        letter-spacing: -0.2px;
    }
    .budget-note {
        font-size: 11px; font-weight: 700; color: #98aec2;
        letter-spacing: 0.2px;
    }

    .info-card {
        display: flex; align-items: flex-start; gap: 11px;
        background: #ffffff; border: 1.5px solid #e2ecf5; border-radius: 14px;
        padding: 11px 13px;
    }
    .info-card i {
        width: 34px; height: 34px; border-radius: 10px;
        background: #eaf1ff; color: #1d4ed8;
        display: flex; align-items: center; justify-content: center;
        font-size: 14px; flex-shrink: 0; margin-top: 1px;
    }
    .info-card.good i { background: #eafaf1; color: #16a34a; }
    .info-card.bad i  { background: #fdeaea; color: #dc2626; }
    .info-card.goal i { background: #f1ebff; color: #7c3aed; }
    .info-label {
        display: block; font-size: 9.5px; font-weight: 800;
        letter-spacing: 0.7px; text-transform: uppercase;
        color: #98aec2; margin-bottom: 2px;
    }
    .info-value {
        display: block; font-size: 13px; font-weight: 700;
        color: #13202d; line-height: 1.4;
    }

    /* ---------- BOXES ---------- */
    .box-title {
        font-size: 11px; font-weight: 800; letter-spacing: 0.8px;
        text-transform: uppercase; display: flex; align-items: center;
        gap: 8px; margin-bottom: 11px;
    }

    .vocab-box {
        background: #f6f2ff; border: 1px solid #e2d8fa;
        border-radius: 18px; padding: 16px 18px; margin-bottom: 14px;
    }
    .vocab-box .box-title { color: #6d28d9; }
    .vocab-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 8px;
    }
    .vocab-item {
        background: #ffffff; border: 1px solid #e8e0f7;
        border-radius: 11px; padding: 8px 13px;
        display: flex; align-items: baseline; gap: 9px;
        flex-wrap: wrap; line-height: 1.35;
    }
    .vocab-en { font-size: 13.5px; font-weight: 800; color: #4c1d95; }
    .vocab-pt { font-size: 12.5px; font-weight: 600; color: #8098ad; }
    .vocab-hint {
        font-size: 11.5px; font-weight: 600; color: #8b6fc4;
        margin-top: 10px; line-height: 1.45;
    }

    .prompts-box {
        background: #f7fafd; border: 1px solid #eaf1f8;
        border-radius: 18px; padding: 16px 18px; margin-bottom: 20px;
    }
    .prompts-box .box-title { color: #0f766e; }
    .prompt-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .prompt-chip {
        background: #ffffff; border: 1.5px solid #dbe7f1; color: #33526e;
        font-size: 13px; font-weight: 700; padding: 7px 14px;
        border-radius: 30px; display: inline-flex; align-items: center; gap: 8px;
        line-height: 1.3;
    }
    .prompt-chip i { color: #0f766e; font-size: 11px; }
    .prompts-hint {
        font-size: 11.5px; font-weight: 600; color: #98aec2;
        margin-top: 11px; line-height: 1.45;
    }

    /* ---------- CTA ---------- */
    .cta { display: flex; flex-direction: column; align-items: center; gap: 9px; }
    .got-it {
        border: none; border-radius: 40px;
        background: linear-gradient(135deg, #16a34a, #0d9488);
        color: #fff; font-family: inherit; font-size: 16px; font-weight: 800;
        letter-spacing: -0.2px; padding: 16px 36px; cursor: pointer;
        display: inline-flex; align-items: center; gap: 12px;
        box-shadow: 0 14px 30px rgba(13, 148, 136, 0.32);
        transition: all 0.18s;
    }
    .got-it:hover { transform: translateY(-2px); box-shadow: 0 18px 38px rgba(13, 148, 136, 0.42); }
    .got-it:active { transform: translateY(0); }
    .got-it i {
        font-size: 13px; background: rgba(255, 255, 255, 0.22);
        width: 26px; height: 26px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
    }
    .cta-hint { font-size: 12.5px; color: #8098ad; font-weight: 600; text-align: center; }

    /* ---------- MODAL ---------- */
    .modal-bg {
        position: fixed; inset: 0; background: rgba(19, 32, 45, 0.5);
        backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
        display: flex; align-items: center; justify-content: center;
        padding: 20px; opacity: 0; pointer-events: none;
        transition: opacity 0.2s; z-index: 500;
    }
    .modal-bg.show { opacity: 1; pointer-events: auto; }
    .modal {
        background: #ffffff; border-radius: 24px;
        padding: 28px 26px 22px; max-width: 420px; width: 100%;
        text-align: center; box-shadow: 0 30px 70px rgba(10, 25, 45, 0.35);
        transform: translateY(14px) scale(0.97);
        transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    }
    .modal-bg.show .modal { transform: none; }
    .modal-emoji { font-size: 38px; line-height: 1; margin-bottom: 12px; }
    .modal h3 { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 7px; }
    .modal p { font-size: 14px; color: #5a7189; font-weight: 500; line-height: 1.5; margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; }
    .mbtn {
        flex: 1; border: none; border-radius: 40px; padding: 13px 18px;
        font-family: inherit; font-size: 14px; font-weight: 800;
        cursor: pointer; transition: all 0.16s;
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .mbtn.ghost { background: #eef3f9; color: #3d5a75; }
    .mbtn.ghost:hover { background: #dbe7f1; }
    .mbtn.primary {
        background: linear-gradient(135deg, #16a34a, #0d9488); color: #fff;
        box-shadow: 0 10px 22px rgba(13, 148, 136, 0.3);
    }
    .mbtn.primary:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(13, 148, 136, 0.38); }

    /* ---------- FINISH ---------- */
    .finish { text-align: center; padding: 46px 26px; }
    .finish-emoji { font-size: 54px; line-height: 1; margin-bottom: 14px; }
    .finish h2 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 10px; }
    .finish p {
        font-size: 15px; color: #5a7189; font-weight: 500;
        line-height: 1.6; margin: 0 auto 24px; max-width: 500px;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 820px) {
        .profile-board { grid-template-columns: 1fr; gap: 14px; }
        .profile-center { order: -1; margin-bottom: 4px; }
        .profile-col { flex-direction: row; flex-wrap: wrap; }
        .info-card { flex: 1 1 100%; }
    }
    @media (max-width: 640px) {
        body { padding: 14px 10px 50px; }
        .card { padding: 18px 15px; border-radius: 20px; }
        .title { font-size: 21px; }
        .lede { font-size: 14px; }
        .mission-brief { padding: 13px 15px; gap: 12px; }
        .mission-brief > i { font-size: 19px; }
        .mission-brief strong { font-size: 13px; }
        .mission-brief span { font-size: 12px; }
        .photo-frame { width: 160px; height: 160px; }
        .vocab-grid { grid-template-columns: 1fr; }
        .got-it { width: 100%; justify-content: center; padding: 15px 20px; }
        .brand h1 { font-size: 16.5px; }
    }
</style>
</head>
<body>

<div class="wrap">

    <header class="top">
        <div class="brand">
            <div class="logo"><i class="fas fa-compass"></i></div>
            <div>
                <h1>Complete the Mission</h1>
                <p>5 missions · read together · talk together</p>
            </div>
        </div>
        <div class="pdot-row" id="dots" aria-label="Progress"></div>
    </header>

    <main id="stage"></main>

</div>

<!-- CONFIRM MODAL -->
<div class="modal-bg" id="modalBg" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-emoji">✅</div>
        <h3 id="modalTitle">Complete this mission?</h3>
        <p id="modalText">Make sure everyone in your group has shared at least one idea before you move on.</p>
        <div class="modal-actions">
            <button type="button" class="mbtn ghost" id="cancelMove">Not yet</button>
            <button type="button" class="mbtn primary" id="confirmMove">
                Yes, next mission <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>
</div>

<script>
(function () {
    'use strict';

    /* ================================================================
       HELPERS
       ================================================================ */
    function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    function portraitFallback(f) {
        return '<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustrated portrait">' +

            '<path d="M58 76 Q58 36 100 36 Q142 36 142 76 Q134 50 100 52 Q72 54 58 76 Z" fill="' + f.hair + '"/>' +
            '<circle cx="86" cy="80" r="4.5" fill="#2b2118"/>' +
            '<circle cx="114" cy="80" r="4.5" fill="#2b2118"/>' +
            '<path d="M90 96 Q100 103 110 96" stroke="#a85c3c" stroke-width="3" fill="none" stroke-linecap="round"/>' +
            '<path d="M36 200 Q36 138 100 138 Q164 138 164 200 Z" fill="' + f.shirt + '"/>' +
            '</svg>';
    }

    /* ================================================================
       THEMES
       ================================================================ */
    var THEMES = [

        /* ---------------- 1 · SÃO PAULO ---------------- */
        {
            kicker: 'Mission 1 · Travel',
            title: '24 hours in São Paulo',
            lede: 'Marco has one full day in São Paulo before his flight home. Help him make it count.',
            mission: 'Plan a 24-hour itinerary for Marco.',
            missionSub: 'Talk together — no typing. When you finish, click Complete mission.',
            person: {
                name: 'Marco',
                tag: 'First time in Brazil',
                budget: '€1,000',
                budgetNote: 'total for 24 hours',
                photo: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&q=80&fit=crop',
                fallback: { skin: '#f0c19c', hair: '#2b2118', shirt: '#1e3a8a', bg: '#eaf1ff' }
            },

                { icon: 'fa-cake-candles', label: 'Age', value: '28 years old' },

        /* ---------------- 4 · DELEGATION ---------------- */
        {
            kicker: 'Mission 4 · Work & International Relations',

            lede: 'Elena is helping host six diplomats for three days. Everything must feel warm — and nothing can go wrong.',

            person: {
                name: 'Elena',
                tag: 'Hosting 6 diplomats',

                budgetNote: 'for three days',

                { icon: 'fa-cake-candles', label: 'Age', value: '26 years old' },
                { icon: 'fa-graduation-cap', label: 'Role', value: 'International Relations student' },
                { icon: 'fa-clock', label: 'Time', value: '3 days · 6 diplomats' }
            ],
            infoRight: [
                { icon: 'fa-heart', label: 'Likes', value: 'Organisation, languages, good timing', tone: 'good' },
                { icon: 'fa-ban', label: 'Dislikes', value: 'Improvisation, being late', tone: 'bad' },
                { icon: 'fa-bullseye', label: 'Goal', value: 'A visit they will remember', tone: 'goal' }
            ],
            vocab: [
                { en: 'delegation', pt: 'delegação' },
                { en: 'protocol', pt: 'protocolo' },
                { en: 'venue', pt: 'local do evento' },
                { en: 'courtesy', pt: 'cortesia' },
                { en: 'gift exchange', pt: 'troca de presentes' },
                { en: 'interpreter', pt: 'intérprete' }
            ],
            prompts: [
                { icon: 'fa-calendar-days', text: 'Official agenda' },
                { icon: 'fa-handshake', text: 'Protocol & etiquette' },
                { icon: 'fa-gift', text: 'Gifts' },
                { icon: 'fa-language', text: 'Translation' },
                { icon: 'fa-utensils', text: 'Official dinner' },
                { icon: 'fa-car', text: 'Transport' }
            ]
        },

        /* ---------------- 5 · MOVING ABROAD ---------------- */
        {
            kicker: 'Mission 5 · Life abroad',
            title: 'Moving abroad: the first 30 days',
            lede: 'Lucas signed his first contract in Europe. He lands in three weeks — and needs a plan for the first month.',
            mission: "Plan Lucas's first 30 days abroad. Paperwork, home, money and people.",
            missionSub: 'Talk together — no typing. When you finish, click Complete mission.',
            person: {
                name: 'Lucas',
                tag: 'First contract in Europe',
                budget: '€3,000',
                budgetNote: 'for the first month',
                photo: 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=400&q=80&fit=crop',
                fallback: { skin: '#c9855a', hair: '#20160f', shirt: '#0d9488', bg: '#eafaf1' }
            },
            infoLeft: [
                { icon: 'fa-cake-candles', label: 'Age', value: '26 years old' },
                { icon: 'fa-location-dot', label: 'Route', value: 'Brazil → Europe' },
                { icon: 'fa-clock', label: 'Time', value: 'First 30 days' }
            ],
            infoRight: [
                { icon: 'fa-heart', label: 'Likes', value: 'Planning, independence, new food', tone: 'good' },
                { icon: 'fa-ban', label: 'Dislikes', value: 'Paperwork, uncertainty', tone: 'bad' },
                { icon: 'fa-bullseye', label: 'Goal', value: 'Feel at home by day 30', tone: 'goal' }
            ],
            vocab: [
                { en: 'paperwork', pt: 'documentos / burocracia' },
                { en: 'lease', pt: 'contrato de aluguel' },
                { en: 'bank account', pt: 'conta bancária' },
                { en: 'residency permit', pt: 'autorização de residência' },
                { en: 'cost of living', pt: 'custo de vida' },
                { en: 'settling in', pt: 'adaptação' }
            ],
            prompts: [
                { icon: 'fa-file-lines', text: 'Paperwork' },
                { icon: 'fa-house', text: 'Temporary housing' },
                { icon: 'fa-building-columns', text: 'Bank & money' },
                { icon: 'fa-mobile-screen', text: 'Phone plan' },
                { icon: 'fa-bus', text: 'Transport' },
                { icon: 'fa-user-group', text: 'First contacts' }
            ]
        }
    ];

    /* ================================================================
       APP STATE
       ================================================================ */
    var idx = 0;

    var stage = document.getElementById('stage');
    var dotsEl = document.getElementById('dots');
    var modalBg = document.getElementById('modalBg');
    var modalTitle = document.getElementById('modalTitle');
    var modalText = document.getElementById('modalText');
    var confirmMove = document.getElementById('confirmMove');
    var cancelMove = document.getElementById('cancelMove');

    /* ================================================================
       RENDER
       ================================================================ */
    function renderDots() {
        var html = '';
        for (var i = 0; i < THEMES.length; i++) {
            var cls = 'pdot';
            if (i < idx) cls += ' done';
            if (i === idx && idx < THEMES.length) cls += ' active';
            html += '<span class="' + cls + '"></span>';
        }
        dotsEl.innerHTML = html;
    }

    function infoCardHTML(item) {
        var tone = item.tone ? ' ' + item.tone : '';
        return '<div class="info-card' + tone + '">' +
                   '<i class="fas ' + esc(item.icon) + '"></i>' +
                   '<div>' +
                       '<span class="info-label">' + esc(item.label) + '</span>' +
                       '<span class="info-value">' + esc(item.value) + '</span>' +
                   '</div>' +
               '</div>';
    }

    function renderTheme() {
        if (idx >= THEMES.length) { renderFinish(); return; }
        var t = THEMES[idx];
        var p = t.person;

        var leftHtml = t.infoLeft.map(infoCardHTML).join('');
        var rightHtml = t.infoRight.map(infoCardHTML).join('');

        var vocabHtml = t.vocab.map(function (v) {
            return '<div class="vocab-item">' +
                       '<span class="vocab-en">' + esc(v.en) + '</span>' +
                       '<span class="vocab-pt">' + esc(v.pt) + '</span>' +
                   '</div>';
        }).join('');

        var promptsHtml = t.prompts.map(function (pr) {
            return '<span class="prompt-chip">' +
                       '<i class="fas ' + esc(pr.icon) + '"></i>' + esc(pr.text) +
                   '</span>';
        }).join('');

        stage.innerHTML =
            '<section class="card">' +

                '<div class="card-top">' +
                    '<span class="kicker">' + esc(t.kicker) + '</span>' +
                    '<span class="counter">' + (idx + 1) + ' / ' + THEMES.length + '</span>' +
                '</div>' +

                '<h2 class="title">' + esc(t.title) + '</h2>' +
                '<p class="lede">' + esc(t.lede) + '</p>' +

                '<div class="mission-brief">' +
                    '<i class="fas fa-bullseye"></i>' +
                    '<div>' +
                        '<strong>Your mission: ' + esc(t.mission) + '</strong>' +
                        '<span>' + esc(t.missionSub) + '</span>' +
                    '</div>' +
                '</div>' +

                '<div class="profile-board">' +

                    '<div class="profile-col">' + leftHtml + '</div>' +

                    '<div class="profile-center">' +
                        '<div class="photo-frame">' +
                            '<img src="' + esc(p.photo) + '" alt="Photo of ' + esc(p.name) + '" ' +
                                 'onerror="this.parentNode.classList.add(\'no-photo\');" />' +
                            '<div class="photo-fallback">' + portraitFallback(p.fallback) + '</div>' +
                        '</div>' +
                        '<div class="profile-name">' + esc(p.name) + '</div>' +
                        '<div class="profile-tag">' + esc(p.tag) + '</div>' +
                        '<div class="budget-badge"><i class="fas fa-wallet"></i>' + esc(p.budget) + '</div>' +
                        '<div class="budget-note">' + esc(p.budgetNote) + '</div>' +
                    '</div>' +

                    '<div class="profile-col">' + rightHtml + '</div>' +

                '</div>' +

                '<div class="vocab-box">' +
                    '<div class="box-title"><i class="fas fa-spell-check"></i> Words to learn together</div>' +
                    '<div class="vocab-grid">' + vocabHtml + '</div>' +
                    '<p class="vocab-hint">Read the word in English, check the meaning in Portuguese, then try to use it when you talk.</p>' +
                '</div>' +

                '<div class="prompts-box">' +
                    '<div class="box-title"><i class="fas fa-lightbulb"></i> Ideas to discuss</div>' +
                    '<div class="prompt-chips">' + promptsHtml + '</div>' +
                    '<p class="prompts-hint">These are only suggestions. Add your own ideas — the plan is yours to create.</p>' +
                '</div>' +

                '<div class="cta">' +
                    '<button type="button" class="got-it" id="gotIt">' +
                        '<span>Complete mission</span><i class="fas fa-check"></i>' +
                    '</button>' +
                    '<p class="cta-hint">Click when your group has finished planning.</p>' +
                '</div>' +

            '</section>';

        renderDots();
        document.getElementById('gotIt').addEventListener('click', openModal);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderFinish() {
        stage.innerHTML =
            '<section class="card finish">' +
                '<div class="finish-emoji">🏁</div>' +
                '<h2>Five missions completed!</h2>' +
                '<p>Which mission was the hardest to decide? Which person would you actually like to help in real life?</p>' +
                '<div class="cta">' +
                    '<button type="button" class="got-it" id="againBtn">' +
                        '<i class="fas fa-rotate-left"></i><span>Start again</span>' +
                    '</button>' +
                '</div>' +
            '</section>';

        renderDots();
        document.getElementById('againBtn').addEventListener('click', function () {
            idx = 0;
            renderTheme();
        });
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ================================================================
       MODAL
       ================================================================ */
    function openModal() {
        var isLast = idx === THEMES.length - 1;
        modalTitle.textContent = isLast ? 'Complete the last mission?' : 'Complete this mission?';
        modalText.textContent = 'Make sure everyone in your group has shared at least one idea before you move on.';

        modalBg.classList.add('show');
        modalBg.setAttribute('aria-hidden', 'false');
        setTimeout(function () { confirmMove.focus(); }, 60);
    }

    function closeModal() {
        modalBg.classList.remove('show');
        modalBg.setAttribute('aria-hidden', 'true');
        var btn = document.getElementById('gotIt');
        if (btn) btn.focus();
    }

    confirmMove.addEventListener('click', function () {
        closeModal();
        idx += 1;
        renderTheme();
    });
    cancelMove.addEventListener('click', closeModal);

    modalBg.addEventListener('click', function (e) {
        if (e.target === modalBg) closeModal();
    });

    document.addEventListener('keydown', function (e) {
        if (!modalBg.classList.contains('show')) return;
        if (e.key === 'Escape') closeModal();
        if (e.key === 'Enter') confirmMove.click();
    });

    /* ================================================================
       BOOT
       ================================================================ */
    renderTheme();

})();
</script>

</body>
</html>
